name: conformance
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: make demo
      - run: python3 eval/self_conformance.py   # fails if a gate check names no clause
      - run: python3 -m eval.tamper             # fails if any tamper attack goes uncaught
      - run: python3 -m eval.verify_ledger
