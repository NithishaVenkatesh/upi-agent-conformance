        - generic [ref=e74]:
          - generic [ref=e76]:
            - paragraph [ref=e77]:
              - text: AI Agents might be allowed to make payments via India’s Unified Payments Interface (UPI),
              - link "reports Business Standard" [ref=e78] [cursor=pointer]:
                - /url: https://www.business-standard.com/finance/news/india-may-allow-agentic-ai-led-upi-transactions-under-new-npci-protocol-126070801343_1.html
              - text: . The National Payments Corporation of India, a private non-profit company that is not under RTI, which runs UPI, is working on a Unified Agent Protocol.
            - paragraph [ref=e79]: "While the report is scant on details about how this agentic protocol will work, there is some precedence:"
            - list [ref=e80]:
              - listitem [ref=e81]:
                - text: Coinbase has the x402 protocol, which “enables AI agents to autonomously discover and procure third-party cloud resources, contextual data, and API tools—making it easier for them to achieve their targeted optimization goals without human-in-the-loop intervention.”…”This enables fully autonomous, AI-driven commerce—
                - strong [ref=e82]: allowing goal-oriented agents to operate independently in an on-demand, permissionless economy.
                - text: ” As I said earlier,
                - link "I’m glad they didn’t name the protocol x420" [ref=e83] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Section_420_of_the_Indian_Penal_Code
                - text: . On a more serious note, Cloudflare, which is allowing publishers to charge to allow agents to access content,
                - link "is using payments via x402 to enable access" [ref=e84] [cursor=pointer]:
                  - /url: https://blog.cloudflare.com/monetization-gateway/
                - text: ". Note to Cloudflare’s team: MediaNama is still waiting for approval. Nudge, nudge."
              - listitem [ref=e85]:
                - text: Pine Labs
                - link "launched an agentic payments protocol" [ref=e86] [cursor=pointer]:
                  - /url: https://www.medianama.com/2026/06/223-pine-labs-agentic-payments-protocol-upi-liability-privacy-questions/
                - text: called P3P, though some questions remain unanswered about data sharing. The company
                - link "open sourced its agentic Oauth framework, for authenticating agents" [ref=e87] [cursor=pointer]:
                  - /url: https://github.com/mishrasanjeev/grantex
                - text: ", which is commendable, and typically, the path to making a framework acceptable. Agentic commerce suffers from the OpenAI vs Google protocol dichotomy, while MCPs have a universal protocol which nobody owns."
            - paragraph [ref=e88]:
              - text: On a side note, inspired by a friend, I’ve given my AI Agent, Saki (
              - link "named after this guy" [ref=e89] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Saki
              - text: ", who wrote wonderfully subversive short stories"
              - link "like this one" [ref=e90] [cursor=pointer]:
                - /url: https://americanliterature.com/author/hh-munro-saki/short-story/the-open-window
              - text: ), access to my credit card. Not made any agentic payments yet.
            - paragraph [ref=e91]: "The reasoning: you get the OTP for completing a transaction anyway."
            - paragraph [ref=e92]:
              - text: I guess the RBI was prepared for agents before they knew what agents are, even though
              - link "2FA caused much pain when it launched" [ref=e93] [cursor=pointer]:
                - /url: https://www.medianama.com/2011/02/223-how-indias-banks-killed-the-future-of-commerce-hrush-bhatt-cleartrip/
              - text: ", and RBI has still botched international payments and doesn’t really care about people getting stranded when they’re out of the country, because RBI appears to think it is god and is unaccountable, much like MeitY and DoT."
            - paragraph [ref=e94]: "A few thoughts on how NPCI should approach agentic payments:"
            - list [ref=e95]:
              - listitem [ref=e96]:
                - strong [ref=e97]: "Trust:"
                - text: Agentic commerce fails because there is lack of trust. People in the US who have given their cards to agents have found, at least one person claimed, that an agent paid for a $2,500 course influenced by an Instagram influencer. We need guardrails, recourse and reversibility, though that is tricky in India.
              - listitem [ref=e98]:
                - strong [ref=e99]: "Identity:"
                - list [ref=e100]:
                  - listitem [ref=e101]: Step one has to be to give agents their own delegated handles, or to make it even simpler, delegate a handle with agent or at agent. So something like agent-nixxin@ybl for me, or agent@nixxin@ybl for me.
                  - listitem [ref=e102]: Separate agent PIN, on by default. Allow users to turn the off. The moment they turn the PIN off, limit goes down to default level, and users have to increase it if they want.
              - listitem [ref=e103]:
                - strong [ref=e104]: "Limits:"
                - text: "Step two should be to allow me to set transaction limits for my agent in three ways. By default:"
                - list [ref=e105]:
                  - listitem [ref=e106]: Limit max amount per transaction, say Rs 100 by default.
                  - listitem [ref=e107]: Limit number of transactions (5) and amount transacted per month (Rs. 500)
                  - listitem [ref=e108]: Limit transactions per day (1), per week (2)
              - listitem [ref=e109]:
                - strong [ref=e110]: "Flexibility:"
                - text: Allow users to change their limits depending on their comfort level.
              - listitem [ref=e111]:
                - strong [ref=e112]: "Recourse:"
                - text: Nudge IRDAI to open up for agentic insurance.
            - paragraph [ref=e113]: Default limits protect users by default. Separate transaction workflow for agents allows transparency and observability.
            - heading [level=3] [ref=e114]:
              - text: But what about
              - strong [ref=e115]: Wallets
              - text: "?"
            - paragraph [ref=e116]:
              - link "I wrote in March that Wallets are actually the natural approach to giving agents money" [ref=e117] [cursor=pointer]:
                - /url: https://www.reasoned.live/p/ai-agents-need-wallets
              - text: ", because they limit the surface area of impact: it is always what made wallets less risky than UPI. Bipin Preet Singh, who read that article in March,"
              - link "agrees" [ref=e118] [cursor=pointer]:
                - /url: https://x.com/BipinSingh/status/2075111099540910364
              - text: ". I wrote then that:"
            - blockquote [ref=e119]:
              - text: “
              - paragraph [ref=e120]:
                - strong [ref=e121]: India sacrificed containment of risk for enabling bank integration for payments.
              - paragraph [ref=e122]: Semi-closed prepaid wallets were more powerful because they not only compartmentalised risk, but they also didn’t require the additional authentication for transactions once money had been loaded into the wallet.
            - paragraph [ref=e123]:
              - text: "At the same time, we have to understand that adoption of agents and agentic payments has to overcome a substantial amount of friction: first agentic adoption, then payments adoption. Friction compounds. There’s (thankfully) unlikely to be a forced adoption of AI, like there was for digital payments with demonetization ("
              - link "my rant from 2016 is still the best piece of writing I have ever done" [ref=e124] [cursor=pointer]:
                - /url: https://www.medianama.com/2016/12/223-year-end-rant-2016-technology-has-never-been-this-political-in-india/
              - text: ).
            - paragraph [ref=e125]:
              - text: I think in order to improve adoption of agentic payments, we’ll have to do both wallets and UPI, but UPI will be critical because wallets will mean fresh adoption friction for a large number of people. What apparently NPCI is planning to do is important for agentic payments and agentic commerce (
              - link "which has its own issues" [ref=e126] [cursor=pointer]:
                - /url: https://www.reasoned.live/p/understanding-openais-commerce-retreat
              - text: ).
            - paragraph [ref=e127]:
              - strong [ref=e128]: "A note for Dilip Asbe:"
              - text: I’m happy to volunteer Saki as a beta tester, if such a framework is planned. He already has my credit card.
            - heading [level=3] [ref=e129]:
              - strong [ref=e130]: On Agents and Autonomy
            - paragraph [ref=e131]:
              - text: "One of the defining characteristics of agents in autonomy, and yet we struggle with it enabling it because we don’t want to lose control. When coding, I’ll be honest, I don’t understand a thing, but the fact that everything has version control (git), allows me to move to yolo mode: it builds what it thinks is right. You might want to read this"
              - link "silly thought experiment about autonomy and emergence" [ref=e132] [cursor=pointer]:
                - /url: https://www.reasoned.live/p/a-declaration-of-the-independence
              - text: .
            - paragraph [ref=e133]: "On Sunday, after a chat with a friend running an agent, I started an experiment: I gave Saki access to Opencode, my Opencode plan, Deepseek-v4-flash as a default coding model, a free Vercel account and Vercel CLI, Github and Github CLI, Flutter, Node.js, and a skill I created called Nightly Magic Builds."
            - paragraph [ref=e134]:
              - strong [ref=e135]: "The instruction:"
              - text: "Go through your interactions with me and my other three agents over the last month and a half (they have a shared Honcho database, but only Saki and Wilde have visibility across Honcho), and identify a job-to-be-done that will help me out. No content: only tools and platforms."
            - paragraph [ref=e136]: "Saki builds at 3AM, and messages me a live Vercel link at 7AM every day. First 30 days is web. Then we’ll move to APK’s. So far he has built:"
            - list [ref=e137]:
              - listitem [ref=e138]:
                - link "A follow up tracker" [ref=e139] [cursor=pointer]:
                  - /url: https://followup-tracker-self.vercel.app/
                - text: ", because I have to follow up with people more than should need to."
              - listitem [ref=e140]: A workshop particpant certificate generator (for my Vibe Coding participants)
              - listitem [ref=e141]:
                - link "A sales overview" [ref=e142] [cursor=pointer]:
                  - /url: https://sponsor-desk-iota.vercel.app/
              - listitem [ref=e143]:
                - link "A writing kan-ban board" [ref=e144] [cursor=pointer]:
                  - /url: https://article-pipeline-ten.vercel.app/
              - listitem [ref=e145]:
                - link "A “Books I’ve read” interface for my kid" [ref=e146] [cursor=pointer]:
                  - /url: https://kid-reads.vercel.app/
                - text: (who reads a lot because he’s device free).
            - paragraph [ref=e147]: "Why I’m telling you all this is because a thought crossed my mind: I’m now considering an experiment wherein Saki will buy me some small items every day, just to try out agentic payments."
            - paragraph [ref=e148]: Should be fun.
