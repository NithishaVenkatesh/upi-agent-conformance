      - generic [ref=f726e49]:
        - generic [ref=f726e51]:
          - paragraph [ref=f726e52]: June 10, 2026 | Purchase, NY
          - paragraph [ref=f726e53]
        - heading "Mastercard launches Agent Pay for Machines to unlock super-fast, always-on payments" [level=1] [ref=f726e56]
        - separator [ref=f726e61]
    - generic [ref=f726e66]:
      - generic [ref=f726e68]:
        - heading "More than 30 industry leaders, including Adyen, Ant International, BVNK, Checkout.com, Cloudflare, Coinbase, Getnet by Santander, Global Payments, Lovable, OKX, Stripe and Tempo, are among the first to leverage and support adoption." [level=2] [ref=f726e73]
        - separator [ref=f726e78]
        - generic [ref=f726e82]:
          - paragraph [ref=f726e83]: The rise of AI has created new ways to buy and sell goods and services. Now it’s requiring a new class of payments.
          - paragraph [ref=f726e84]: Mastercard envisions a future where businesses create services for AI agents to buy and use. Operating at machine speed, these agents could transact with each other continuously at high velocity, executing chains of transactions, including microtransactions. This shift could unlock a massive new wave of innovation, business models and economic activity, where any company, from solopreneurs to the largest enterprises, can become a virtual powerhouse.
          - paragraph [ref=f726e85]:
            - text: "To enable this new form of commerce, Mastercard developed a new way to pay for these services: payments, some only fractions of a cent, to be completed quickly, programmatically and securely. Today, the company is introducing"
            - link "Agent Pay for Machines (AP4M)" [ref=f726e86] [cursor=pointer]:
              - /url: https://www.mastercard.com/us/en/business/artificial-intelligence/mastercard-agent-pay/agent-pay-for-machines.html
            - text: ", a new service that will allow these transactions to be permissioned, orchestrated and settled at machine speed across its global payments network."
          - paragraph [ref=f726e87]: “Agent Pay for Machines will create the conditions for a superbloom of AI business models,” said Jorn Lambert, Mastercard’s chief product officer. “Machine payments can make it possible for services to be bought and sold among agents at fundamentally different scales than payments today — very high volumes, very small values, very fast and at extremely low latency.”
          - paragraph [ref=f726e88]: Unlike traditional point-of-sale or person-to-merchant payments, which are discrete and user-initiated, these transactions are programmatic, always-on and executed between systems in the background of digital commerce. Agent Pay for Machines allows Mastercard network participants to bring the trust and controls of the company’s global network to machine-driven commerce, helping AI innovators enable secure, reliable payments as software begins to transact on its own.
        - generic [ref=f726e90]:
          - heading "Building a new class of payments" [level=4] [ref=f726e93]
          - generic [ref=f726e95]:
            - paragraph [ref=f726e96]: AI agents are no longer just assisting decisions. They are able to act on human intent, coordinate services and complete transactions that are bespoke for their users. An entrepreneur opening a flower shop could instruct an AI agent to build and launch the store's web presence — buying a domain name, a hosting service, images and checkout pages within a defined budget — turning one human‑initiated request into a chain of transactions executed automatically across providers.
            - paragraph [ref=f726e97]: Or a logistics agent managing a delivery route could pay for freight, reserve loading-bay access, purchase temporary cold-chain monitoring data and settle warehouse handling fees automatically as a shipment moves from origin to destination.
            - paragraph [ref=f726e98]: "Payments don’t just increase. They change form. They become continuous, embedded, permissioned and executed at machine speed. And that creates a new requirement: infrastructure that can keep up."
            - paragraph [ref=f726e99]: In this new environment, businesses need peace of mind they will get paid. Agents need transactions to move instantly, with every transaction completed securely and as expected. Mastercard Agent Pay for Machines is designed to meet these needs.
            - paragraph [ref=f726e100]:
              - text: The service builds on
              - link "Mastercard’s Agent Pay program" [ref=f726e101] [cursor=pointer]:
                - /url: https://www.mastercard.com/us/en/business/artificial-intelligence/mastercard-agent-pay.html
              - text: ", introduced in 2025, by providing a system to scale high-frequency, low-latency, low-value payments executed by agents and machines. Where Agent Pay defines how trusted AI agents participate in payments, Agent Pay for Machines is designed for a complementary opportunity: automated, micro- and machine-driven transactions that happen continuously in the background of digital commerce."
            - paragraph [ref=f726e102]: This is where Mastercard’s global network plays a critical role. Mastercard Agent Pay for Machines supports credentialing, controls and guaranteed settlement across multiple payment types, from cards to stablecoins, enabling organizations to deploy automated payments with the interoperability, reliability and governance that the digital economy requires.
            - paragraph [ref=f726e103]
