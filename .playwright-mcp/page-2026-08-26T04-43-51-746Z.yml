          - heading "Supporting the next phase of digital commerce" [level=4] [ref=f726e172]
          - generic [ref=f726e174]:
            - paragraph [ref=f726e175]: Mastercard Agent Pay for Machines expands Mastercard’s efforts to enable trusted digital interactions, from identity and authentication to trusted data exchange, so businesses can adopt new technologies without compromising the security, reliability and reach they expect from Mastercard’s global network. Together with Agent Pay and Verifiable Intent, Mastercard Agent Pay for Machines reflects Mastercard’s continued investment in building trusted, open infrastructure for autonomous, agent-driven and machine-driven payments.
            - paragraph [ref=f726e176]:
              - text: To learn more about Mastercard Agent Pay for Machines, please visit
              - link "https://www.mastercard.com/us/en/business/artificial-intelligence/mastercard-agent-pay/agent-pay-for-machines.html" [ref=f726e177] [cursor=pointer]:
                - /url: https://www.mastercard.com/us/en/business/artificial-intelligence/mastercard-agent-pay/agent-pay-for-machines.html
              - text: .
            - paragraph [ref=f726e178]
          - heading "Quote sheet" [level=4] [ref=f726e181]
          - generic [ref=f726e183]:
            - paragraph [ref=f726e184]:
              - text: “Payments and treasury management are inseparable,” said Stani Kulechov, founder and CEO of
              - link "Aave Labs" [ref=f726e185] [cursor=pointer]:
                - /url: https://aave.com/
              - text: . “As Mastercard Agent Pay for Machines transforms payments, Aave delivers the foundational credit layer and deep liquidity to optimize treasury capital at machine speed.”
            - paragraph [ref=f726e186]:
              - text: “Machine-to-machine payments are still in their early stages, but the infrastructure decisions made now will determine how this space develops,” said Karan Katyal, head of Agentic Commerce at
              - link "Adyen" [ref=f726e187] [cursor=pointer]:
                - /url: https://www.adyen.com/
              - text: . “Building these foundations with partners like Mastercard, openly and with merchant outcomes at the center, is how we ensure this next era of commerce works for everyone in the ecosystem.”
            - paragraph [ref=f726e188]:
              - text: “We're heading toward an economy where most transactions never involve a person at all - machines paying each other, constantly, for things too small to bother a human with. That unlocks business models nobody can build today, but only once the payment layer can keep up,’ said Joe Lau, co-founder and president of
              - link "Alchemy" [ref=f726e189] [cursor=pointer]:
                - /url: https://www.alchemy.com/
              - text: . “Getting that right is one of the most important problems in tech right now.”
            - paragraph [ref=f726e190]:
              - text: "\"The future of commerce isn't just digital, it's autonomous. At Anchorage Digital, we've long believed that programmable, machine-driven payments are the inevitable next layer of financial infrastructure, and this collaboration with Mastercard turns that conviction into reality,” said Nathan McCauley, co-founder and CEO,"
              - link "Anchorage Digital" [ref=f726e191] [cursor=pointer]:
                - /url: http://anchorage.com/
              - text: . “What makes this initiative so significant is that it brings together the trust and global reach of Mastercard's network with the flexibility of multi-rail settlement, including digital assets, creating a foundation that our clients can build on with confidence. This is exactly the kind of open, interoperable infrastructure the industry needs to bring agentic commerce to scale.”
            - paragraph [ref=f726e192]:
              - text: "\"We are pleased to partner with Mastercard to accelerate the growth of agentic commerce through continuous innovation in agent-driven payments,” said Jiang-Ming Yang, chief innovation officer,"
              - link "Ant International" [ref=f726e193] [cursor=pointer]:
                - /url: https://www.ant-intl.com/
              - text: . “Through Antom, our merchant payment service, Ant International empowers global merchants to access leading agentic commerce platforms with one simple integration while delivering cutting-edge agentic payment capabilities and seamless payment experiences. Together, we are helping merchants capture new growth opportunities in the AI commerce era with greater security, intelligence, and efficiency."
            - paragraph [ref=f726e194]:
              - text: “Agentic commerce only matters if it helps humans get something done. The payment should fade into the background while the business, the agent, and the merchant coordinate around the customer’s intent,” said James Armstead, chief technology officer at
              - link "Basis Theory" [ref=f726e195] [cursor=pointer]:
                - /url: https://basistheory.com/
              - text: . “That’s the future Mastercard is helping unlock, and Basis Theory is excited to help bring it to life.”
            - paragraph [ref=f726e196]:
              - text: “We’re seeing a fundamental shift in commerce as businesses increasingly use AI agents to transact on their behalf,” said Chris Harmse, co-founder and chief business officer at
              - link "BVNK" [ref=f726e197] [cursor=pointer]:
                - /url: https://bvnk.com/
              - text: . “At BVNK, we believe stablecoins will play a powerful role in enabling this change, bringing greater speed, programmability and efficiency to how value moves. Our position at the intersection of currencies, rails and formats makes us uniquely well-suited to power agentic commerce at scale, enabling trusted movement of value with the controls, reliability, visibility and flexibility that merchants need.”
            - paragraph [ref=f726e198]:
              - text: “Catena gives businesses a single control plane to govern agent-driven payments across networks and rails, applying identity, policies, approvals and auditability wherever money moves,” said Sean Neville, CEO of
              - link "Catena" [ref=f726e199] [cursor=pointer]:
                - /url: https://catena.com/
              - text: . “Mastercard Agent Pay for Machines initiative is an important addition to that interoperable ecosystem, and we’re excited to help make autonomous commerce safer and more practical for customers under one consistent set of controls.”
            - paragraph [ref=f726e200]:
              - text: “As AI agents begin to play a larger role in digital commerce, the payments infrastructure must evolve to support the enterprise merchants driving this economy,” said Matthieu Barral, global head of Partnerships at
              - link "Checkout.com" [ref=f726e201] [cursor=pointer]:
                - /url: https://www.checkout.com/
              - text: . “We're working with Mastercard to define how programmable, agent-driven payments operate in practice — combining our processing capabilities with their secure network to give businesses the precise control and flexibility required to thrive in this next chapter of commerce.”
            - paragraph [ref=f726e202]:
              - text: "\"The internet was built for human interactions, but the infrastructure of the future must be built for autonomous ones,” said Stephanie Cohen, chief strategy officer at"
              - link "Cloudflare" [ref=f726e203] [cursor=pointer]:
                - /url: https://www.cloudflare.com/
              - text: . “Cloudflare has already become the premier environment to build and secure AI agents; now, those agents need a trusted way to independently pay for the resources they consume. By partnering with Mastercard on Agent Pay for Machines, we are connecting our industry-leading developer and security platform with world-class payments infrastructure to power the next era of machine-to-machine commerce."
            - paragraph [ref=f726e204]:
              - text: “AI agents are creating entirely new forms of commerce that require payments to move at machine speed,” said Nina Coughlin, head of Stablecoin Business Development at
              - link "Coinbase" [ref=f726e205] [cursor=pointer]:
                - /url: http://coinbase.com/
              - text: . “We’re excited to work alongside Mastercard to help advance an open and interoperable framework for agentic payments, combining trusted payment networks with programmable digital dollars and open standards like x402 to enable secure, scalable commerce between agents, businesses, and developers worldwide.”
            - paragraph [ref=f726e206]:
              - text: “Coinflow has spent years making instant payments frictionless by bridging stablecoin infrastructure with traditional payment networks,” said Ben Meeder chief technology officer at
              - link "Coinflow" [ref=f726e207] [cursor=pointer]:
                - /url: https://coinflow.cash/
              - text: . “Now we’re thrilled to partner with Mastercard to bring that same simplicity to agentic commerce, enabling businesses to accept payments from AI agents as effortlessly as they do from humans.”
            - paragraph [ref=f726e208]:
              - text: "\"The barrier to agentic commerce is no longer capability, it's trust: knowing an agent is authorized to act, that it stays within its limits and that every payment is accountable,” said Alfonso Gomez Jordana, co-founder of"
              - link "Crossmint" [ref=f726e209] [cursor=pointer]:
                - /url: https://www.crossmint.com/
              - text: . “Mastercard solves this, extending the risk, fraud and compliance infrastructure of its network to machine payments. Crossmint is excited to serve as the PSP of the agent in this trusted network.”
            - paragraph [ref=f726e210]:
              - text: “Machine-to-machine payments represent the next frontier of commerce, where trust, speed and intelligence converge at the transaction layer,” said Bruno Oliveira Da Silva, global head of Getnet Data and AI Products at
              - link "Getnet by Santander" [ref=f726e211] [cursor=pointer]:
                - /url: https://www.getnetworld.com/
              - text: . “At Getnet, we believe the future belongs to acquirers who can enable autonomous commerce at scale, and our partnership with Mastercard puts us at the center of that transformation, from Latin America to Europe and beyond.”
            - paragraph [ref=f726e212]:
              - text: “As programmatic, machine-led commerce emerges, where agents pay for compute and other resources, getting the payment layer right is essential,” said Cindy Turner, chief product officer at
              - link "Global Payments" [ref=f726e213] [cursor=pointer]:
                - /url: https://www.globalpayments.com/
              - text: . “Open collaboration across the ecosystem will be key. We are proud to partner with Mastercard on Agent Pay for Machines to help deliver trusted, interoperable infrastructure that can scale with our customers’ needs.”
            - paragraph [ref=f726e214]:
              - text: "\"As commerce shifts from clicks to continuous machine-speed transactions, merchants need payment infrastructure that keeps up, without giving up control,” said Maria Parpou, executive vice president,"
              - link "Mastercard Merchant Cloud" [ref=f726e215] [cursor=pointer]:
                - /url: https://www.mastercard.com/us/en/business/payments/merchant-cloud.html
              - text: . “Through Mastercard Merchant Cloud, we're connecting merchants to Agent Pay for Machines so they can confidently accept and orchestrate agent-driven payments, backed by the trust, governance and multi-rail reach of Mastercard's global network."
            - paragraph [ref=f726e216]:
              - text: "“Machine payments underpin the business model of AI agents: metered pricing. Before an agent’s labor is metered, authorized, and settled with real trust, it needs the ability to pay and get paid,” Don Gossen, co-founder and CEO,"
              - link "Nevermined" [ref=f726e217] [cursor=pointer]:
                - /url: https://nevermined.ai/
              - text: . “We are proud to partner with Mastercard to build the Commerce Logic Layer, which lets AI agents transact with other agents and agentic services.”
            - paragraph [ref=f726e218]:
              - text: "\"OKX moves billions in settlement daily across some of the most complex, high-velocity markets in the world. We're executing a bold vision laid out by our Founder and CEO, Star Xu, having already built our Agentic Wallet and Agent Payments Protocol to handle exactly this kind of autonomous, machine-speed commerce,” said Haider Rafique, global managing partner at"
              - link "OKX" [ref=f726e219] [cursor=pointer]:
                - /url: https://www.okx.com/
              - text: . “Partnering with Mastercard to bring that infrastructure to scale globally is where this was always heading. We're ready for it."
            - paragraph [ref=f726e220]:
              - text: “AI agents are becoming economic participants, and machine-to-machine payments are a critical building block for that future,” said Johnathan McGowan, CEO of
              - link "PayOS" [ref=f726e221] [cursor=pointer]:
                - /url: https://payos.ai/
              - text: . “We believe agents will become embedded across every experience. As that happens, they’ll need a trusted way to participate in the economy at machine speed. We’re proud to partner with Mastercard on this initiative to build the infrastructure needed to make that possible.”
            - paragraph [ref=f726e222]:
              - text: "\"Polygon Labs is building the infrastructure for programmable payments and agent-driven commerce at global scale, with the Open Money Stack helping make digital financial services more accessible and interoperable,” said Aishwary Gupta, global head of business at"
              - link "Polygon" [ref=f726e223] [cursor=pointer]:
                - /url: https://polygon.technology/
              - text: . “Mastercard's exploration of machine payments underscores how blockchain and traditional payment networks can work together to unlock new consumer and business experiences while accelerating the evolution of the digital payments ecosystem."
            - paragraph [ref=f726e224]:
              - text: "\"Payments made by machines look very different from payments made by people, happening far more often and at far smaller amounts than today's systems were designed for. Change at this scale needs creative answers from more than one company, because the future of payments cannot run through a single closed ecosystem,” said Farooq Malik, co-founder and CEO of"
              - link "Rain" [ref=f726e225] [cursor=pointer]:
                - /url: https://rain.xyz/
              - text: . “Rain is excited to build on our Mastercard principal membership and partner on Agent Pay for Machines as we expand to support the agentic future."
            - paragraph [ref=f726e226]:
              - text: "\"Autonomous agents are already settling invoices and paying for compute on their own, but institutions can only move at that speed if the controls move with them,” said Markus Infanger, senior vice president of"
              - link "RippleX" [ref=f726e227] [cursor=pointer]:
                - /url: https://ripple.com/
              - text: . “XRPL and RLUSD are built so enterprises can let agents transact at machine speed within rules the chain itself enforces, with settlement in seconds, predictable costs, programmable compliance, and a full audit trail, so agents can only ever do what they are authorized to do. Mastercard's move toward regulated stablecoin settlement on-chain is an important signal that this is evolving from an emerging capability into an enterprise standard."
            - paragraph [ref=f726e228]:
              - text: “Most agent projects stall before production, because the infrastructure was never built for them,” said Ilan Zerbib, founder and CEO of
              - link "Sapiom" [ref=f726e229] [cursor=pointer]:
                - /url: https://www.sapiom.ai/
              - text: . “Payment rails designed for humans cannot authorize an agent. Mastercard Agent Pay for Machines closes that gap at the settlement layer. Sapiom handles runtime, execution and access to the machine economy. Together they enable agents to act, transact and complete work in production without months of bespoke infrastructure.”
            - paragraph [ref=f726e230]:
              - text: "\"Trust enables machine payments at scale and we're excited to partner with Mastercard so verified agents can transact anywhere,” said Ankit Agarwal, chief technology officer at"
              - link "Skyfire" [ref=f726e231] [cursor=pointer]:
                - /url: https://skyfire.xyz/
              - text: .
            - paragraph [ref=f726e232]:
              - text: "\"Right now, there is an opportunity to define how AI agents will seamlessly pay for the goods and services they need,” said Rishin Sharma, head of AI Growth,"
              - link "Solana Foundation" [ref=f726e233] [cursor=pointer]:
                - /url: https://solana.org/
              - text: . “The infrastructure powering these transactions will need to operate across stablecoins, card networks, and other payment rails. Solana is built to enable these types of solutions at scale, and we’re excited to work alongside Mastercard." “Agentic commerce needs payment infrastructure that can support autonomous execution and reliable settlement. Mastercard Agent Pay for Machines is a meaningful step in that direction, connecting agent-initiated payments to global infrastructure built for real-world scale,” said Chandler Fang, co-founder of
              - link "t54 Labs" [ref=f726e234] [cursor=pointer]:
                - /url: https://www.t54.ai/
              - text: . “By partnering with Mastercard, t54 brings its trust layer to Machine Payments, adding real-time transaction-level risk assessment, Know Your Agent verification and traceability across the payment lifecycle. This helps create a clear evidence layer for agent authorization, chargebacks, dispute resolution, and liability review, making agent-led payments more secure, auditable and accountable.”
            - paragraph [ref=f726e235]:
              - text: "\"Agentic commerce needs open standards at the protocol layer and open settlement rails underneath,” said Dan Romero, go-to-market at"
              - link "Tempo" [ref=f726e236] [cursor=pointer]:
                - /url: https://tempo.xyz/
              - text: . “We're excited to work with Mastercard on Machine Payments Protocol compatibility, with Tempo providing stablecoin settlement for agent-driven payments at scale.”
            - paragraph [ref=f726e237]:
              - text: "\"We're entering an era where AI agents are becoming economic actors, making purchases and moving value without any human in the loop,” said Bryce Ferguson, Co-Founder & CEO,"
              - link "Turnkey" [ref=f726e238] [cursor=pointer]:
                - /url: https://www.turnkey.com/
              - text: . Machine-to-machine payments only work if agent actions are secure, auditable, and policy-controlled. Mastercard's agentic commerce initiative is building the common framework the industry needs to make that possible, and Turnkey is excited to provide the secure wallet infrastructure that enables trusted, programmable transactions at scale."
            - paragraph [ref=f726e239]:
              - text: "\"The next phase of payments will be increasingly programmable, automated and embedded into how machines and businesses interact,” said Bentzi Rabi, co-founder and CEO of"
              - link "Utila" [ref=f726e240] [cursor=pointer]:
                - /url: https://utila.io/
              - text: . “We are excited to work with Mastercard to help provide the secure stablecoin and digital asset infrastructure needed to make these flows fast, governed and scalable.”
