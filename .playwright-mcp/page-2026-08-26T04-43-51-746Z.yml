          - heading "How it works" [level=4] [ref=f726e118]
          - generic [ref=f726e120]:
            - paragraph [ref=f726e121]: "Mastercard Agent Pay for Machines establishes a trusted system for machine-driven transactions through a set of foundational capabilities:"
            - list [ref=f726e122]:
              - listitem [ref=f726e123]:
                - text: "Credentialing: Every agent is credentialed, and with"
                - link "Verifiable Intent" [ref=f726e124] [cursor=pointer]:
                  - /url: https://www.mastercard.com/us/en/news-and-trends/stories/2026/verifiable-intent.html
                - text: ", can be recognized and transact with trust across ecosystems."
              - listitem [ref=f726e125]: "Permissioning: Organizations can set authorization rules and spending limits that are programmatically enforced, ensuring transactions stay within defined parameters."
              - listitem [ref=f726e126]: "Transacting: Verified participants can connect and transact across providers and systems, enabling continuous, high-frequency automated commerce."
              - listitem [ref=f726e127]: "Settling: Supports reliable, guaranteed multi-rail settlement across cards, accounts and stablecoins."
            - paragraph [ref=f726e128]: Transactions move predictably, improving transparency and consistency.
            - paragraph [ref=f726e129]
