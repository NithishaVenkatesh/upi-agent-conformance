            - generic [ref=f188e81]:
              - paragraph [ref=f188e82]: "The Graph gives us the global level: market trends, liquidity, volume, fees, and lending activity across different protocols."
              - paragraph [ref=f188e83]: "NutHatch, our custom indexer, shows the individual level: swaps, wallets, large players, and their actions."
              - paragraph [ref=f188e84]: DeepTrace connects both levels to find relationships between global market changes and the individual participants behind them.
            - heading "How it's Made" [level=3] [ref=f188e85]
            - generic [ref=f188e86]:
              - paragraph [ref=f188e87]: We built DeepTrace as a read-only MCP server using Node.js, TypeScript, GraphQL, Zod, Vitest, and the MCP SDK.
              - paragraph [ref=f188e88]: "The Graph provides the global level: standardized market data from Messari Subgraphs. We use it to compare WETH/USDC Uniswap V3 pools and USDC lending markets across Aave v3, Seamless, and Moonwell."
              - paragraph [ref=f188e89]: "NutHatch, our custom Base indexer, provides the individual level: large swaps, wallets, token amounts, and data freshness. DeepTrace connects both levels to find relationships between general market behavior and individual players."
              - paragraph [ref=f188e90]: If one source fails, we keep the successful results and clearly report what is missing.
              - paragraph [ref=f188e91]: We created a SKILL.md for Agents. The project runs in a Proxmox container through Cloudflare Tunnel.
