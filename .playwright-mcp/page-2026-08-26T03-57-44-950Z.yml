          - heading "Activation steps for UPI:" [level=3] [ref=f60e615]
          - paragraph [ref=f60e616]:
            - text: The createMandate response includes a
            - strong [ref=f60e617]: deep_link
            - text: "field — a UPI intent URL that the customer must approve in their UPI app. Follow these steps:"
          - list [ref=f60e618]:
            - listitem [ref=f60e619]:
              - strong [ref=f60e620]: Extract deep_link
              - text: — Read
              - strong [ref=f60e621]: deep_link
              - text: from the create mandate response.
            - listitem [ref=f60e622]:
              - strong [ref=f60e623]: Generate a QR code
              - text: — Use any QR library (e.g. qrcode in Python, qrcode.react in JS) to encode the
              - strong [ref=f60e624]: deep_link
              - text: into a scannable QR.
            - listitem [ref=f60e625]:
              - strong [ref=f60e626]: Display to customer
              - text: — Show the QR code on your UI. The customer scans it with their UPI app to approve the mandate.
            - listitem [ref=f60e627]:
              - strong [ref=f60e628]: Poll for activation
              - text: — After the customer scans, poll the mandate status until it becomes ACTIVE.
          - heading "Activation steps for Cards:" [level=3] [ref=f60e629]
          - list [ref=f60e630]:
            - listitem [ref=f60e631]:
              - strong [ref=f60e632]: Get checkout URL
              - text: — Extract the checkout_url from the create mandate response.
            - listitem [ref=f60e633]:
              - strong [ref=f60e634]: Display checkout
              - text: — Show the checkout URL in a modal/iframe on your UI. The customer enters their card details in the checkout window.
            - listitem [ref=f60e635]:
              - strong [ref=f60e636]: Card validation
              - text: — The customer completes card authorization. After successful authorization, they validate the transaction using OTP sent to their registered mobile.
            - listitem [ref=f60e637]:
              - strong [ref=f60e638]: Poll for activation
              - text: — After the user completes payment and authorization is successful, poll the mandate status until it becomes ACTIVE.
