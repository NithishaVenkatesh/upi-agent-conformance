  - generic [ref=f722e35]:
    - generic [ref=f722e41]:
      - heading "press release" [level=2] [ref=f722e46]
      - generic [ref=f722e48]:
        - generic [ref=f722e50]:
          - paragraph [ref=f722e51]: September 10, 2025 | Purchase, NY
          - paragraph [ref=f722e52]
        - heading "Mastercard unveils new tools and collaborations to power smarter, safer agentic commerce" [level=1] [ref=f722e55]
      - separator [ref=f722e60]
    - generic [ref=f722e65]:
      - generic [ref=f722e67]:
        - heading "Mastercard is helping shape the future of AI-powered payments and setting the foundation for trusted agentic transaction standards" [level=3] [ref=f722e72]
        - separator [ref=f722e77]
        - paragraph [ref=f722e82]: Mastercard is advancing AI-powered payments with new tools for developers, expanded consulting services and deeper collaboration across the global tech and finance ecosystem. These efforts are laying the foundation for smarter, more secure shopping experiences using artificial intelligence and intelligent agents as the company is helping to set the standards for how AI can securely and confidently handle payments.
        - generic [ref=f722e84]:
          - heading "Building the future of AI shopping" [level=4] [ref=f722e87]
          - paragraph [ref=f722e90]:
            - text: Mastercard is working with AI and commerce leaders including Stripe, Google and Ant International’s Antom to make secure agentic transactions accessible and scalable for digital merchants and platforms globally. By the holiday season, all U.S. Mastercard cardholders will be enabled for the
            - link "Mastercard Agent Pay" [ref=f722e91] [cursor=pointer]:
              - /url: https://www.mastercard.com/us/en/business/artificial-intelligence/mastercard-agent-pay.html
            - text: program, with global rollout to follow shortly thereafter. Ahead of this, Citi and U.S. Bank Mastercard cardholders will be the first to have the opportunity to experience AI-enabled shopping as agentic commerce providers and enablers like PayOS, Firmly.AI, Basis Theory and other industry players go live.
        - generic [ref=f722e93]:
          - heading "New tools to accelerate adoption" [level=4] [ref=f722e96]
          - generic [ref=f722e98]:
            - paragraph [ref=f722e99]: "Separately, to help developers and businesses get started quickly, Mastercard is launching:"
            - list [ref=f722e100]:
              - listitem [ref=f722e101]:
                - paragraph [ref=f722e102]:
                  - link "Agent Toolkit" [ref=f722e103] [cursor=pointer]:
                    - /url: https://developer.mastercard.com/platform/documentation/agent-toolkit/
                  - text: ": Available on Mastercard Developers, the toolkit enables AI assistants and agentic tools to seamlessly access and interpret Mastercard’s API documentation using structured, machine-readable content via the Model Context Protocol (MCP) server. This supports integration with platforms like Claude, Cursor, and GitHub Copilot – making Mastercard APIs more discoverable and easier to integrate in agentic workflows. The availability of MCP complements the Agent2Agent protocol."
            - list [ref=f722e104]:
              - listitem [ref=f722e105]:
                - paragraph [ref=f722e106]: "Agent Sign-Up: A simple way for those using the Agent Toolkit to identify their agents and access AI-enabled Mastercard products and services."
            - list [ref=f722e107]:
              - listitem [ref=f722e108]:
                - paragraph [ref=f722e109]: "Insight Tokens: A secure and governed way for agents to access and apply permissioned insights from Mastercard. As agentic commerce matures, Insight Tokens will enable consumers to receive, with their consent, more personalized and useful experiences and information. Insight Tokens are built on Mastercard technology that is already supported by B2B partners like SAP Concur."
            - list [ref=f722e110]:
              - listitem [ref=f722e111]:
                - paragraph [ref=f722e112]: "Agentic Consulting Services: Expert support to help issuers, acquirers, merchants and AI enablers design intelligent shopping experiences, and get up and running faster."
          - generic [ref=f722e114]:
            - heading "Setting industry standards for the future of payments" [level=4] [ref=f722e117]
            - paragraph [ref=f722e120]: Mastercard is leveraging its expertise in shaping global, interoperable digital payments standards – including contactless and tokenization – to help define how payments should operate in agentic environments. Together with the FIDO Alliance and its Payments Working Group, Mastercard and other industry leaders are developing a verifiable credential standard for payments that confirms payment details such as amount, merchant and product. This ensures that everyone involved in a transaction can experience confidence that it was approved by the shopper, paving the way for a more secure, seamless and trusted foundation for agentic payments.
            - generic [ref=f722e122]:
              - heading "Laying the foundation for agentic experiences" [level=4] [ref=f722e125]
              - generic [ref=f722e127]:
                - paragraph [ref=f722e128]: “AI-powered payments aren’t just a trend — they’re a transformation,” said Craig Vosburg, chief services officer at Mastercard. “Payments must be native to the agentic experience. We’re building the infrastructure for a new generation of intelligent transactions, where consumers and developers can empower AI agents to act on their behalf with trust, transparency and precision."
                - paragraph [ref=f722e129]: “We’re working with partners across the ecosystem to build the standards and tools that will define agentic commerce,” said Jorn Lambert, chief product officer at Mastercard. “We’re committed to enabling a trusted environment for AI-powered payments to scale globally.”
                - paragraph [ref=f722e130]: Mastercard’s infrastructure and standards are designed to support trusted real-world agentic transactions today and are ready to scale as more people and businesses adopt them.
                - paragraph [ref=f722e131]
