        - generic [ref=f142e74]:
          - img "fintech" [ref=f142e76]
          - generic [ref=f142e77]:
            - paragraph [ref=f142e78]:
              - text: Pine Labs has
              - link "launched" [ref=f142e79] [cursor=pointer]:
                - /url: https://www.pinelabs.com/docs/online-payments/ai/p3p
              - text: the
              - link [ref=f142e80] [cursor=pointer]:
                - /url: https://www.pinelabs.com/media-analyst/the-ai-agent-can-now-pay-pine-labs-launches-p3p-indias-first-agentic-payment-protocol-built-on-upi
                - strong [ref=f142e81]: Pine Labs Payment Protocol (P3P)
                - text: ","
              - text: a system built on the Unified Payments Interface (UPI) that lets Artificial Intelligence (AI) agents, software that acts on a user’s behalf, make and complete payments on their own, without the user approving each transaction. The user gives permission once, in advance, and the AI agent then pays within the limits they set.
            - paragraph [ref=f142e82]:
              - strong [ref=f142e83]: "How P3P works:"
              - text: "The user sets up a UPI mandate, a standing instruction that pre-approves payments up to a fixed limit, and the AI agent transacts within those bounds. The protocol combines three parts:"
            - list [ref=f142e84]:
              - listitem [ref=f142e85]:
                - strong [ref=f142e86]: "UPI’s mandate frameworks:"
                - text: Two existing UPI systems,
                - strong [ref=f142e87]: Single Block Multiple Debit (SBMD)
                - text: ", which Pine Labs brands as UPI ReservePay, and"
                - strong [ref=f142e88]: One Time Mandate (OTM)
                - text: . These systems set aside a fixed amount in the user’s bank account upfront and debit it later when a condition is met.
              - listitem [ref=f142e89]:
                - strong [ref=f142e90]: "Grantex:"
                - text: A separate identity layer that checks whether the AI agent is genuine, enforces the user’s spending limits, and keeps a record of every payment for the user to review.
              - listitem [ref=f142e91]:
                - strong [ref=f142e92]: "Hypertext Transfer Protocol 402 (HTTP 402):"
                - text: An open web standard, a publicly available technical rule any developer can use, that lets software request and make payments in a machine-readable way. This is what allows any AI agent on any platform to use P3P, not just one company’s assistant.
            - paragraph [ref=f142e93]: The user approves the mandate once by scanning a code in their UPI app, after which the agent’s requests debit against the reserved funds without fresh approval. The user can cancel the mandate at any time.
            - paragraph [ref=f142e94]:
              - strong [ref=f142e95]: "Who is live on it:"
            - list [ref=f142e96]:
              - listitem [ref=f142e97]:
                - strong [ref=f142e98]: Gullak
                - text: ", a digital gold savings platform, is the first to go live. A user sets a rule such as “buy Rs 500 of gold if the price drops below Rs 16,000 per gram”, approves a mandate once, and the AI agent automatically buys the gold when the price meets the condition."
              - listitem [ref=f142e99]:
                - strong [ref=f142e100]: Vijay Sales
                - text: ", an electronics retail chain, is in a proof of concept, testing P3P to let an AI agent buy a product the moment it hits a user’s target price."
            - paragraph [ref=f142e101]:
              - text: P3P is currently live on UPI ReservePay only. Pine Labs says cards, net banking, wallets and Equated Monthly Instalment (EMI) options are on its roadmap. Its developer documentation separately lists
              - strong [ref=f142e102]: stablecoins
              - text: ", cryptocurrencies pegged to stable assets such as the US dollar, as a future payment rail."
            - paragraph [ref=f142e103]:
              - strong [ref=f142e104]: "How P3P differs from Razorpay’s agentic payments:"
              - text: Razorpay has offered agentic UPI payments since October 2025, first with the National Payments Corporation of India (NPCI) and OpenAI on
              - link "ChatGPT" [ref=f142e105] [cursor=pointer]:
                - /url: https://www.medianama.com/2025/10/223-razorpay-npci-openai-agentic-payments-upi-chagpt/
              - text: ", and later with Anthropic on Claude. In those cases, the payment still requires the user’s final consent before completion, even though the shopping and checkout happen inside a specific AI assistant such as ChatGPT or Claude."
            - paragraph [ref=f142e106]: P3P uses the same underlying UPI mandate mechanism, but operates as a standalone protocol with a common set of rules that any software can plug into, allowing any AI agent on any app or website to use it instead of tying it to one assistant.
            - paragraph [ref=f142e107]:
              - strong [ref=f142e108]: "Pine Labs’ prior agentic work:"
              - text: This is not Pine Labs’ first move into agentic payments. MediaNama has
              - link "covered" [ref=f142e109] [cursor=pointer]:
                - /url: https://www.medianama.com/2026/05/223-pine-labs-npci-autonomous-upi-payments-model-context-protocol/
              - text: its earlier talks with NPCI on autonomous UPI payments through its Model Context Protocol (MCP) server, a tool that connects AI systems directly to its payment infrastructure, and its subsidiary Setu’s agentic bill-payments service on Claude and ChatGPT. The company has
              - link "stayed quiet" [ref=f142e110] [cursor=pointer]:
                - /url: https://www.medianama.com/2026/01/223-pine-labs-agentic-ai-payments-privacy-concerns-q3fy26-earnings/
              - text: on privacy questions analysts raised about what data AI providers receive versus what Pine Labs retains, and whether the company stores prompts and transaction details or uses them to train AI models.
            - paragraph [ref=f142e111]:
              - text: Pine Labs
              - link "positions" [ref=f142e112] [cursor=pointer]:
                - /url: https://www.moneycontrol.com/technology/pine-labs-launches-full-agentic-payment-without-human-intervention-razorpay-vouches-for-consumer-control-article-13947467.html
              - text: "P3P as a consumer-controlled framework where users predefine spending limits, merchants, triggers and validity conditions, while AI agents only execute transactions within those pre-approved boundaries. However, the system still raises unresolved regulatory, security and liability questions. We outline some of them below:"
            - paragraph [ref=f142e113]:
              - strong [ref=f142e114]: 1. Is Pine Labs using the UPI mandate framework for a purpose it was not built for?
              - text: "A UPI mandate, the standing instruction that pre-approves payments, originally supported recurring, scheduled payments to a known merchant: a monthly subscription, a Systematic Investment Plan (SIP) into a mutual fund, or an Equated Monthly Instalment (EMI) on a loan. It did not originally support one-off, event-triggered purchases that an AI agent independently decides and executes."
            - paragraph [ref=f142e115]: With P3P, AI agents can buy gold whenever a price condition is met or grab a flash sale the moment it goes live, stretching the mandate well beyond its original design. Pine Labs has not publicly stated whether NPCI created or approved a separate framework for autonomous AI-triggered purchases under UPI mandates.
            - paragraph [ref=f142e116]:
              - strong [ref=f142e117]: 2. How does P3P square with RBI’s rule that every payment needs an extra security check?
              - text: The Reserve Bank of India (RBI), in its
              - link "Digital Payments E-Mandate Framework, 2026" [ref=f142e118] [cursor=pointer]:
                - /url: https://www.medianama.com/2026/04/223-rbi-additional-factor-authentication-e-mandates/
              - text: ", requires that setting up any mandate be verified using Additional Factor of Authentication (AFA), an extra security step such as a one-time password (OTP) or a UPI Personal Identification Number (PIN). Normally, every UPI payment requires the user to enter their UPI PIN at the moment of paying. P3P removes that step at the point of payment: the user approves the ReservePay mandate once, and the AI agent then debits the reserved funds without requiring a PIN each time."
            - paragraph [ref=f142e119]: Under the RBI framework, banks can process recurring transactions up to Rs 15,000 without Additional Factor Authentication (AFA) once a user sets a mandate, but they still require AFA for transactions above Rs 15,000. It is not clear how P3P handles a single agent-initiated payment above that limit, given there is no human present to authenticate it.
            - paragraph [ref=f142e120]:
              - strong [ref=f142e121]: 3. Who is responsible if an AI agent makes a wrong or unauthorised payment?
              - text: MediaNama’s
              - link "coverage" [ref=f142e122] [cursor=pointer]:
                - /url: https://www.medianama.com/2026/03/223-razorpay-sarvam-ai-ai-agent-payments-indus-app/
              - text: of Razorpay’s agentic payments launch found no agreement in the industry on who is liable when an AI agent pays incorrectly. Razorpay said agentic shopping “does not rewrite the rules of commercial liability”, meaning the merchant handles a wrong order and Razorpay covers payment-security failures.
            - paragraph [ref=f142e123]:
              - text: Pine Labs markets P3P as producing a cryptographically verifiable receipt for each transaction, which it says supports dispute resolution, but it has not stated who actually bears liability when an agent pays in error. The question matters most for high-value payments that users cannot reverse, such as locking in a down payment before stock runs out.
              - strong [ref=f142e124]: 4. What data does P3P share with AI providers, and on what terms?
              - text: When an analyst asked what transaction data goes to AI providers versus what stays with Pine Labs, CEO Amrish Rau
              - link "declined to answer" [ref=f142e125] [cursor=pointer]:
                - /url: https://www.medianama.com/2026/01/223-pine-labs-agentic-ai-payments-privacy-concerns-q3fy26-earnings/
              - text: . P3P now extends from bill payments to autonomous purchase decisions, which means more data about what a user buys and when. Whether the user’s prompts, transaction records and spending behaviour are stored, passed to AI providers such as OpenAI or Anthropic, or used to train their AI models, has not been disclosed.
            - paragraph [ref=f142e126]:
              - strong [ref=f142e127]: 5. Does the stablecoin roadmap clash with India’s position on crypto?
              - text: Pine Labs’
              - link "developer documentation" [ref=f142e128] [cursor=pointer]:
                - /url: https://www.pinelabs.com/docs/online-payments/ai/p3p/quickstart
              - text: lists stablecoin as a future payment rail for P3P. India
              - link "does not" [ref=f142e129] [cursor=pointer]:
                - /url: https://www.indiatoday.in/india/story/cryptocurrency-ban-legal-tender-rbi-bitcoin-ethereum-1880972-2021-11-26?utm_source=chatgpt.com
              - text: recognise cryptocurrencies as legal tender, and the Reserve Bank of India (RBI) has repeatedly raised concerns about the financial stability and monetary risks posed by private cryptocurrencies. How Pine Labs intends to settle agentic payments in stablecoin within India’s regulatory environment, and whether it would receive regulatory clearance to do so, is unclear.
            - paragraph [ref=f142e130]:
              - emphasis [ref=f142e131]: MediaNama has reached out to Pine Labs with questions. This copy will be updated when we receive a response.
            - paragraph [ref=f142e132]: "Also read:"
            - list [ref=f142e133]:
              - listitem [ref=f142e134]:
                - link "Pine Labs in talks with NPCI for ‘autonomous’ UPI payments on Model Context Protocol" [ref=f142e135] [cursor=pointer]:
                  - /url: https://www.medianama.com/2026/05/223-pine-labs-npci-autonomous-upi-payments-model-context-protocol/
