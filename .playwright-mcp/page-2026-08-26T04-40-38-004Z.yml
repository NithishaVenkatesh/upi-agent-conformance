  - generic [ref=f712e35]:
    - generic [ref=f712e41]:
      - heading "PRESS RELEASE" [level=2] [ref=f712e46]
      - generic [ref=f712e48]:
        - generic [ref=f712e50]:
          - paragraph [ref=f712e51]: April 29, 2025 | Purchase, NY
          - paragraph [ref=f712e52]
        - heading "Mastercard unveils Agent Pay, pioneering agentic payments technology to power commerce in the age of AI" [level=1] [ref=f712e55]
        - separator [ref=f712e60]
    - generic [ref=f712e63]:
      - generic [ref=f712e67]:
        - generic [ref=f712e69]:
          - heading "Mastercard will work with Microsoft and other leading AI platforms to scale agentic commerce" [level=3] [ref=f712e72]
          - separator [ref=f712e75]
        - generic [ref=f712e79]:
          - heading "What we are saying:" [level=4] [ref=f712e82]
          - list [ref=f712e85]:
            - listitem [ref=f712e86]:
              - paragraph [ref=f712e87]: Mastercard today announced the launch of its Agentic Payments Program, Mastercard Agent Pay. The groundbreaking solution integrates with agentic AI to revolutionize commerce.
            - listitem [ref=f712e88]:
              - paragraph [ref=f712e89]: Mastercard Agent Pay will deliver smarter, more secure, and more personal payments experiences to consumers, merchants, and issuers.
            - listitem [ref=f712e90]:
              - paragraph [ref=f712e91]: The program introduces Mastercard Agentic Tokens, which build upon proven tokenization capabilities that today power global commerce solutions like mobile contactless payments, secure card-on-file, and Mastercard Payment Passkeys, as well as programmable payments like recurring expenses and subscriptions. This helps unlock an agentic commerce future where consumers and businesses can transact with trust, security, and control.
            - listitem [ref=f712e92]:
              - paragraph [ref=f712e93]: Mastercard will collaborate with Microsoft on new use cases to scale agentic commerce, with other leading AI platforms to follow.
            - listitem [ref=f712e94]:
              - paragraph [ref=f712e95]: Mastercard will also partner with technology enablers like IBM, with its watsonx Orchestrate product, to accelerate B2B use cases.
            - listitem [ref=f712e96]:
              - paragraph [ref=f712e97]: In addition, Mastercard will work with acquirers and checkout players like Braintree and Checkout.com to enhance the tokenization capabilities they are already using today with merchants to deliver safe, transparent agentic payments.
            - listitem [ref=f712e98]:
              - paragraph [ref=f712e99]: For banks, tokenized payment credentials will be seamlessly integrated across agentic commerce platforms, keeping card issuers at the forefront of this rapidly evolving technology with enhanced visibility, security, and control.
        - generic [ref=f712e101]:
          - heading "How it works:" [level=4] [ref=f712e104]
          - list [ref=f712e107]:
            - listitem [ref=f712e108]:
              - paragraph [ref=f712e109]: Mastercard Agent Pay will enhance generative AI conversations for people and businesses alike by integrating trusted, seamless payments experiences into the tailored recommendations and insights already provided on conversational platforms.
            - listitem [ref=f712e110]:
              - paragraph [ref=f712e111]: This means that for a soon-to-be-30-year-old planning her milestone birthday party, she can now chat with an AI agent to proactively curate a selection of outfits and accessories from local boutiques and online retailers based on her style, the venue’s ambience, and weather forecasts. Based on her preferences and feedback, the intelligent agent can make the purchase, and also recommend the best way to pay, for example using Mastercard One Credential.
            - listitem [ref=f712e112]:
              - paragraph [ref=f712e113]: A small textile enterprise will be able to use their AI agent to handle sourcing, optimize payment terms and manage logistics with an international supplier. From there, the AI agent can complete the cross-border purchase using a Mastercard virtual corporate card token and arrange for cost-effective, expedited delivery.
            - listitem [ref=f712e114]:
              - paragraph [ref=f712e115]: By identifying and validating a customer using Mastercard’s tokenization technology, a retailer will be able to offer a meaningful and consistent shopping experience, layering on relevant and personalized benefits, such as recommended products, free delivery, rewards, and discounts.
        - generic [ref=f712e117]:
          - heading "What it means:" [level=4] [ref=f712e120]
          - list [ref=f712e123]:
            - listitem [ref=f712e124]:
              - paragraph [ref=f712e125]: Mastercard will work with Microsoft to integrate Microsoft’s leading AI technologies, including Microsoft Azure OpenAI Service and Microsoft Copilot Studio, with Mastercard’s trusted payment solutions to develop and scale agentic commerce, addressing the evolving needs of the entire commerce value chain.
            - listitem [ref=f712e126]:
              - paragraph [ref=f712e127]: Grounded by the company's commitment to responsible AI, Mastercard Agent Pay will ensure that payments being made within AI platforms are safe and transparent at every stage of the transaction – before, during and after.
        - generic [ref=f712e129]:
          - heading "Going deeper:" [level=4] [ref=f712e132]
          - list [ref=f712e135]:
            - listitem [ref=f712e136]:
              - paragraph [ref=f712e137]: "Securely registering and authenticating trusted agents: The program will require trusted AI agents to be registered and verified, after which they will be able to make secure payments on behalf of their users."
            - listitem [ref=f712e138]:
              - paragraph [ref=f712e139]: "Facilitating safe and secure transactions: Enhanced tokenization technology will enable payments to be initiated through conversational interfaces and conducted at millions of merchants of all sizes supporting online commerce today. Every player in the value chain, from consumers to issuers and merchants, will be able to recognize the transactions that are facilitated by intelligent agents, delivering greater transparency."
            - listitem [ref=f712e140]:
              - paragraph [ref=f712e141]: "Establishing clear rules for consumer control: Consumers will have complete control over what the agent is allowed to purchase on their behalf, ensuring that the payments they make are securely authorized and identified."
            - listitem [ref=f712e142]:
              - paragraph [ref=f712e143]: "Protecting against fraud and supporting consumer disputes: Mastercard’s best-in-class cyber, security, and authentication capabilities will protect merchants and consumers against bad actors from end-to-end. This will include the use of AI agents to facilitate strong consumer authentication leveraging on-device biometrics and a process to help clarify agentic transactions that may be unfamiliar or unrecognized."
        - generic [ref=f712e145]:
          - heading "Hear from experts:" [level=4] [ref=f712e148]
          - list [ref=f712e151]:
            - listitem [ref=f712e152]:
              - paragraph [ref=f712e153]: “Mastercard is transforming the way the world pays for the better by anticipating consumer needs on the horizon,” said Jorn Lambert, chief product officer at Mastercard. “The launch of Mastercard Agent Pay marks our initial steps in redefining commerce in the AI era, including new merchant interfaces to distinguish trusted agents from bad actors using agentic technology. Recognizing the seismic implications of this evolution, we are keen to collaborate with industry players to advance the standards for agentic payments, such as applying the Model Context Protocol to Secure Remote Commerce. This lays the foundation for scale and builds trust in agentic commerce.”
        - generic [ref=f712e155]:
          - generic [ref=f712e157]:
            - heading "What's next:" [level=4] [ref=f712e160]
            - list [ref=f712e163]:
              - listitem [ref=f712e164]:
                - paragraph
                - paragraph [ref=f712e165]: As agentic commerce evolves, Mastercard is committed to ongoing, responsible innovation in this space – enabling use cases today and keeping an eye on the vision for tomorrow.
          - heading "Learn more:" [level=4] [ref=f712e168]
          - list [ref=f712e171]:
            - listitem [ref=f712e172]:
              - paragraph [ref=f712e173]:
