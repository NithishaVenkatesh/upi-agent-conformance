                - paragraph [ref=f200e2388]: Citrea is the first ZK Rollup on Bitcoin with EVM compatibility, featuring a BitVM-based trust-minimized bridge called Clementine. Ensuring on-chain verifiability and data availability on Bitcoin, Citrea makes it possible to build everything as a Bitcoin Application - a ₿app.
                - paragraph [ref=f200e2389]: Through its trust-minimized (1-of-N) Bitcoin bridge Clementine and fully EVM-compatible execution environment, Citrea unlocks the trillion-dollar asset base of Bitcoin to be utilized in DeFi and money markets, tapping a massive liquidity, without any change to Bitcoin’s consensus.
