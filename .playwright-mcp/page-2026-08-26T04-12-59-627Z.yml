            - generic [ref=f200e4125]:
              - heading "About" [level=3] [ref=f200e4126]
              - paragraph [ref=f200e4128]: Integra is a new EVM-compatible blockchain built for real estate tokenization and regulated real-world assets (RWAs). Most Web3 dApps today are built for unregulated tokens. That works for DeFi, NFTs, and gaming, but it does not work for serious assets like real estate. Real estate requires compliance. Transfers must respect KYC, AML, and jurisdictional rules. This is where security token standards like ERC-3643 and ERC-1404 come in. They allow assets to be issued, traded, and managed with built-in transfer restrictions and compliance checks. Integra is building the rails where these standards can finally be used at scale, unlocking the $326T real estate market for Web3.
            - generic [ref=f200e4129]:
              - heading "Prizes" [level=3] [ref=f200e4130]
              - generic [ref=f200e4133]:
                - generic [ref=f200e4140] [cursor=pointer]:
                  - generic [ref=f200e4141]: 🏠 Best Real Estate Solution/dApp/Idea
                  - text: ⸺ $1,000
                - generic [ref=f200e4144]:
                  - generic [ref=f200e4146]:
                    - paragraph [ref=f200e4147]: The prize recognizes the project that pushes boundaries in applying blockchain to real estate. From tokenization to compliance rails, from asset registries to new user experiences, we welcome bold experiments that can shape the future of real estate on-chain. The winning team receives $1000 and the chance to explore further collaboration with Integra’s ecosystem of builders, real estate leaders, and technology partners.
                    - paragraph [ref=f200e4148]: "We want hackers to explore how security tokens could transform real estate. Your project can take any form:"
                    - list [ref=f200e4149]:
                      - listitem [ref=f200e4150]: A Solidity smart contract
                      - listitem [ref=f200e4151]: A full-stack dApp
                      - listitem [ref=f200e4152]: A proof of concept
                      - listitem [ref=f200e4153]: An advanced design or prototype
                  - generic [ref=f200e4155]:
                    - heading "Qualification Requirements" [level=3] [ref=f200e4156]
                    - generic [ref=f200e4158]:
                      - paragraph [ref=f200e4159]: Projects must use blockchain to address real estate–related challenges, with emphasis on compliance, interoperability, and real-world adoption.
                      - list [ref=f200e4160]:
                        - listitem [ref=f200e4161]:
                          - paragraph [ref=f200e4162]: "Real Estate Focus: The project must demonstrate a clear link to real estate or regulated real-world assets (e.g., property tokenization, compliance workflows, asset registries, financing tools, or marketplaces)."
                        - listitem [ref=f200e4163]:
                          - paragraph [ref=f200e4164]: "EVM Compatibility: Built on Ethereum or any EVM testnet, with working code/prototype."
                        - listitem [ref=f200e4165]:
                          - paragraph [ref=f200e4166]: "Compliance & Standards: Incorporates regulated asset logic (ERC-3643, ERC-1404, KYC/AML, or attestation flows) or demonstrates awareness of compliance needs in real estate."
                        - listitem [ref=f200e4167]:
                          - paragraph [ref=f200e4168]: "Transparency & Verification: Preference to solutions integrating asset provenance, verification, or data attestation aligned with Integra’s Asset Passport vision."
                        - listitem [ref=f200e4169]:
                          - paragraph [ref=f200e4170]: "Creativity & Impact: Innovative use of blockchain for ownership, liquidity, identity, analytics, or gamified experiences that can expand access to real estate."
                        - listitem [ref=f200e4171]:
                          - paragraph [ref=f200e4172]: "Technical Execution: Functional demo or proof-of-concept with clear documentation."
                        - listitem [ref=f200e4173]:
                          - paragraph [ref=f200e4174]: "Ecosystem Potential: Shows how the idea could plug into Integra’s Asset Operating System and broader real estate ecosystem"
