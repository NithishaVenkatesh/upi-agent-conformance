              - generic [ref=f200e901]:
                - paragraph [ref=f200e902]: Flow is a layer one blockchain with a powerful smart contract language (Cadence) and full EVM equivalence (any Solidity, smart contract, or protocol that works on Ethereum or an EVM L2 works on Flow). The network was designed from the ground up to enable consumer crypto applications that scale to mainstream audiences and seamlessly connect to digital ecosystems. It is based on a unique, multi-role architecture, and designed to scale without sharding, allowing for massive improvements in speed and throughput while preserving a developer-friendly, ACID-compliant environment.
                - paragraph [ref=f200e903]: Flow has been architected with a clear vision for the future of consumer crypto, and meticulously designed to address the shortcomings of earlier blockchains to ensure scalability, usability, and efficiency are not simply an afterthought. By incorporating critical protocol-level primitives, such as account abstraction and on-chain randomness, as well a powerful transaction model and scalability without sharding, Flow sets itself apart as a blockchain made for those interested in building apps for widespread adoption and developer-friendly innovation.
