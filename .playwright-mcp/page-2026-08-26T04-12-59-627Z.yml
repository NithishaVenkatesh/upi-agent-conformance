              - generic [ref=f200e3845]:
                - paragraph [ref=f200e3846]: Kadena has gone EVM! Come and build with the only scalable Proof of Work layer 1, powered by Chainweb, our unique multi-chain architecture.
                - paragraph [ref=f200e3847]: By running multiple parallel chains, Kadena scales horizontally without sacrificing security or decentralization. Our new EVM-compatible chains let developers seamlessly deploy Ethereum projects while taking advantage of Kadena’s scalability and low fees.
                - paragraph [ref=f200e3848]: Deploy today on our EVM testnet and start building the future on Kadena.
