            - generic [ref=f745e103]: India is building the digital infrastructure for allowing next generation artificial intelligence (AI) tools to make financial transactions with minimal human involvement through devices such as smart phones, relying on the country’s Unified Payments Interface (UPI), according to four persons aware about the development.
            - generic [ref=f745e107]:
              - generic [ref=f745e108]: The proposed new standard for artificial intelligence (AI)-led agentic payments, a Unified Agent Protocol (UAP), could place the country among the first to build national infrastructure for agentic payments, said the persons, who spoke on condition anonymity. Work is underway at the National Payments Corporation of India (NPCI) to develop the proposed UAP in consultation with the industry, they said.
              - generic [ref=f745e111]: The proposed protocol is being designed to create a trusted, common, interoperable infrastructure through which AI agents can be registered, verified, and authorised to transact across the UPI ecosystem without changing the underlying rails of the payments system.
