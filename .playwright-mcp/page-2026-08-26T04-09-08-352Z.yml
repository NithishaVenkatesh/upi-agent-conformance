          - generic [ref=f183e93]:
            - heading "Project Description" [level=3] [ref=f183e94]
            - generic [ref=f183e95]:
              - paragraph [ref=f183e96]: GlassBox402 converts APIs into an x402.
              - list [ref=f183e97]:
                - listitem [ref=f183e98]:
                  - paragraph [ref=f183e99]: One npm package. x402ify turns any existing API into an x402 API in minutes. No code, and your upstream key never leaves your machine.
                - listitem [ref=f183e100]:
                  - paragraph [ref=f183e101]: Hedera, Base and Solana. One flag picks where it settles, so there is no separate payment integration to build per chain.
                - listitem [ref=f183e102]:
                  - paragraph [ref=f183e103]: One dashboard. Revenue across every API you have wrapped, which endpoints are called, payment and usage trends, and pricing policies, including charging humans and AI agents differently.
              - paragraph [ref=f183e104]: Machines can pay for it directly. No signup, no key, no human.
            - heading "How it's Made" [level=3] [ref=f183e105]
            - generic [ref=f183e106]:
              - paragraph [ref=f183e107]: "At a high level: x402ify wraps any API in an x402 paywall, the paywall streams every payment event into a hub, and the hub feeds a live dashboard. The protocol layer is the official @x402 packages rather than a reimplementation, which is what makes the whole thing chain-agnostic."
              - paragraph [ref=f183e108]: x402ify, the npm package
              - list [ref=f183e109]:
                - listitem [ref=f183e110]: A Node CLI that builds a Hono app around x402ResourceServer and HTTPFacilitatorClient
                - listitem [ref=f183e111]: paymentMiddleware gates every route, then the paid request is proxied upstream with the operator's key injected server-side, so the buyer never sees it
                - listitem [ref=f183e112]: "Handles the three auth patterns real APIs use: header keys, Bearer tokens and query-param keys, plus both REST and GraphQL shapes"
                - listitem [ref=f183e113]: Each chain is a preset of facilitator, scheme, network id and price format, so adding a network is a config entry, not a rewrite
                - listitem [ref=f183e114]: Published on npm, so anyone can wrap their own API today
              - paragraph [ref=f183e115]: Hedera, where it settles
              - list [ref=f183e116]:
                - listitem [ref=f183e117]: Settlement runs through the blocky402 facilitator, the textbook Hedera x402 flow
                - listitem [ref=f183e118]: The resource server holds no private key. The facilitator and the buyer's wallet do the signing, so an operator monetizes an API without custodying anything
                - listitem [ref=f183e119]: "Two Hedera services, not one. The transfer moves the value, and the Hedera Consensus Service records what it was for: every settled payment writes a receipt to a public HCS topic with the lane, buyer, price and settlement transaction"
                - listitem [ref=f183e120]: That makes the dashboard auditable instead of trusted. Read the topic off the mirror node with none of our code in the loop and it has to match the payments table row for row
                - listitem [ref=f183e121]: Account lazy-create means a judge connects a fresh MetaMask 0x address and their Hedera account is created by their first payment, so onboarding an EVM user is a side effect, not a step
              - paragraph [ref=f183e122]: World ID, for human versus agent pricing
              - list [ref=f183e123]:
                - listitem [ref=f183e124]: The hub verifies a Selfie Check proof once against World's v4 endpoint, then mints a short-lived HMAC session token bound to the rp-scoped nullifier
                - listitem [ref=f183e125]: The gateway checks that signature locally on every request, so human pricing adds zero latency per call and cannot be faked with a header
                - listitem [ref=f183e126]: Binding to the nullifier instead of the wallet means one human is one session, no matter how many wallets their agent rotates through
              - paragraph [ref=f183e127]: The Graph
              - list [ref=f183e128]:
                - listitem [ref=f183e129]: A real Uniswap v3 subgraph is one of the monetized APIs, at 0.02 HBAR per GraphQL query
                - listitem [ref=f183e130]: The repo ships an MCP server with two tools, list_paid_apis and paid_fetch, so any Claude or GPT agent becomes a paying customer of it and the payment lands on the dashboard mid-answer
              - paragraph [ref=f183e131]: The dashboard
              - list [ref=f183e132]:
                - listitem [ref=f183e133]: Frontend fed by a WebSocket event stream from the hub
                - listitem [ref=f183e134]: The hub aggregates analytics and appends every event to a replayable tape
                - listitem [ref=f183e135]: "Everything is scoped to the connected wallet: a lane belongs to whoever it pays out to"
