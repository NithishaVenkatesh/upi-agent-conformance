                    - paragraph [ref=f155e872]: Glossary of Key Terms
                    - text: Sl. No. Term Description 1 Accountability The obligation of individuals or organizations to account for their actions, accept responsibility, and disclose results transparently through specific means and criteria. [ISO/IEC 22989] 2 Adversarial input attacks Deliberate changes to input data intended to mislead AI models into incorrect decisions or predictions. 3 Agent to Agent (A2A) protocol A communication protocol enabling autonomous agents to interact without human involvement. 4 Agentic AI Agentic AI refers to an automated entity that senses and responds to its environment and takes actions to achieve its goals. [ISO/IEC 22989] 5 Model-on-Model risk Risk arising when one AI system oversees another and fails, potentially causing cascading errors and widespread issues. 6 AI incident An event where an AI system malfunctions or behaves unpredictably, possibly causing harm or violating safety, fairness or privacy. 7 AI inertia Resistance within organizations to adopt AI due to cultural, technical, or regulatory barriers. 8 AI inventory A structured record of all AI systems in use, detailing purpose, risks, dependencies, and performance, to ensure visibility, oversight, and effective risk management across operations. 9 AI Safety Institute An institution under India AI Mission promoting safe, secure, and trustworthy AI innovation by coordinating research and collaboration across academia, industry, startups, and government. 10 Algorithmic trading Automated rule-based trading where decisions are made by computer models. [SEBI] 11 Alternative credit scoring models Using alternative data to assess a borrower’s financial health. [HKMA] 12 Artificial Intelligence An AI system is a machine-based system that, for explicit or implicit objectives, infers, from the input it receives, how to generate outputs such as predictions, content, recommendations, or decisions that can influence physical or virtual environments. Different AI systems vary in their levels of autonomy and adaptiveness after deployment. (Explanatory Memorandum on the updated OECD Definition Of an AI System, December 2023.) 13 Auditability The ability to inspect and verify system processes and decisions. [maddevs.io] 14 Behaviour Audit Evaluating AI decisions in real-world settings for ethical and legal alignment. 15 Black box problem AI systems whose internal workings are opaque to users. [IBM] 16 Credential stuffing Automated use of stolen credentials to access user accounts. [OWASP] 17 Data minimisation Collecting only the personal data necessary for a specific service. [ICO] 18 Data poisoning Manipulating training data to corrupt AI/ML models. [IBM] 19 Decision trees Hierarchical models used for classification and regression. [IBM] 20 Deepfake AI-generated or manipulated image, audio or video content that resembles existing persons, objects, places, entities or events and would falsely appear to a person to be authentic or truthful. [EU AI Act, 2024, Article 3(60)] 21 Deep learning A subset of ML using deep neural networks to mimic human decision-making. [IBM] 22 Differential privacy A method introducing randomness to protect data privacy without affecting analysis. [IEEE] 23 Dynamic threat detection Real-time identification and response to cybersecurity threats. 24 Endpoint Detection and Response (EDR) Software using analytics and automation to protect endpoint devices and IT assets. [IBM] 25 Equity Fair treatment of individuals. [Merriam-Webster] 26 Estimation and calibration risk Risk from incorrect or poorly tuned model parameters causing inaccurate outputs. 27 Explainability Property of an AI system to express important factors influencing the AI system results in a way that humans can understand. [ISO/IEC 22989] 28 Fairness Ensuring AI decisions are free from undesirable bias or discrimination. 29 Federated learning Federated learning is a decentralized approach to training machine learning (ML) models. Each node across a distributed network trains a global model using its local data, with a central server aggregating node updates to improve the global model. [IBM] 30 Fine tuning Adapting pre-trained models for specific tasks. [IBM] 31 Foundation models Large AI models trained on vast datasets for general tasks. [IBM] 32 Generative AI Models that generate text, images, or other content. [IBM] 33 GPU (Graphics Processing Unit) A co-processor designed to accelerate graphics and image processing, and specialized tasks in Machine Learning and Deep Learning involving heavy matrix operations. [IBM] 34 Hallucination AI hallucination is a phenomenon with Generative AI that produces outputs that are inaccurate and sometimes, non-sensical. [IBM] 35 Homomorphic encryption Encryption allowing operations on encrypted data by third parties without accessing original data [ISO/IEC 18033-6:2019] 36 Human in the loop/ Human-allied AI Involving human expertise in the AI lifecycle particularly during training and deployment to actively improve system performance and reliability. [Google Cloud] 37 Inference attacks Attacks against ML models that infers sensitive attributes of a training data record, given partial knowledge about the record. [NIST] 38 Security information and event management (SIEM) Application that provides the ability to gather security data and present that data for action via a single interface. [NIST] 39 Landing zones Scalable cloud configurations for enterprise adoption. [Google Cloud] 40 Large Language Models (LLMs) Foundation models capable of understanding and generating natural language. [IBM] 41 Logistic regression A type of linear classifier that predicts the probability of an observation being part of a class. [NIST] 42 Machine learning A process of optimizing model parameters through computational techniques, such that the model's behaviour reflects the data or experience. [ISO/IEC 22989] 43 Memory scraping Extracting sensitive data from RAM before encryption, targeting information that is temporarily stored in memory, such as payment card details, login credentials, etc., before it is encrypted or stored persistently. 44 Metadata Descriptive and structural information about data. (e.g., data format, syntax, and semantics) and descriptive metadata describing data contents (e.g., information security labels). [NIST] 45 Model Bias Bias- Systematic difference in treatment of certain objects, people or groups in comparison to others [ISO/IEC 22989] Model Bias- Systematic errors in a model arising from erroneous assumptions during the modelling process, that cause it to consistently make incorrect or skewed predictions. 46 Model Concentration Dependence on a few limited set of models across systems and institutions, increasing systemic risk when these limited models fail. 47 Model Context Protocol (MCP) An open protocol that standardises how applications provide context to LLMs. [modelcontextprotocol.io] 48 Model Correlation Statistical similarity between two or more models that measures how similarly or differently the models performs when evaluated on the same datasets. 49 Model Degradation The gradual or sudden decline in the model’s performance over time, resulting in less accurate or reliable predictions compared to its initial performance. 50 Model Distillation A machine learning technique that aims to transfer the learnings of a large pre-trained model, the “teacher model,” to a smaller “student model.” [IBM] 51 Model Drift Model Performance decline due to data or relationship changes. [IBM] 52 Model Herding Many AI models across institutions behaving similarly due to relying on shared data or design, leading towards model concentration. 53 Model Life Cycle Life Cycle- evolution of a system, product, service, project or other human-made entity, from conception through retirement. [ISO/IEC 22989] Model Life Cycle- The stages an AI model goes through, from creation and training to deployment, monitoring, and eventual retirement 54 Model Manipulation Intentional alteration or interference with an AI model’s parameters, structure, or inputs to influence its behavior or outputs, often for malicious purposes. 55 Model Inversion Attackers reverse-engineering models to extract data and information [OWASP] 56 Model Risk The risk of error due to inadequacies in financial risk measurement and valuation models. [ECB] 57 Model Validation Validation- confirmation, through the provision of objective evidence, that the requirements for a specific intended use or application have been fulfilled [ISO/IEC 22989] Model Validation- Verifying model accuracy and reliability post-training, to ensure the trained AI model performs as per the intended purpose. 58 Natural Language Processing (NLP) Systems processing and interpreting human language. (language that is or was in active use in a community of people and whose rules are deduced from usage) [ISO/IEC 22989] 59 Neural Networks A network composed of one or more layers of interconnected simple computing elements, known as neurons, linked by adjustable weights, that processes input data to produce outputs, mimicking the structure and function of neurons in the human brain. [ISO/IEC 22989] 60 Open-source Model AI models that can be used, examined, altered and distributed, without having to request permission. In some instances, commercial use of the open models may be restricted [IBM] 61 Privileged Access Attacks An attack that targets privileged accounts such as administrator or root-level accounts to gain unauthorized control of systems, networks, or sensitive data. 62 Prompt Injection Exploiting prompt concatenation to manipulate AI behaviour [NIST] 63 Red teaming An exercise, reflecting real-world conditions, that is conducted as a simulated adversarial attempt to compromise organizational missions and/or business processes to provide a comprehensive assessment of the security capability of the information system and organization. [NIST] 64 Retrieval Augmented Generation (RAG) Combines retrieval systems with Generative AI to deliver contextual responses. RAG systems fetch relevant information from external knowledge bases and provide it to the GenAI model, enabling accurate and up-to-date outputs without retraining the model. [NIST] 65 Small Language Models (SLMs) AI models, smaller in scope and scale, capable of processing, understanding and generating natural language content, audio, video, etc. [IBM] 66 Support Vector machines A supervised machine learning algorithm that classifies data by finding an optimal separator that maximizes the distance between each class in an N-dimensional space. [IBM] 67 Synthetic data Artificial data that is generated from original data and a model that is trained to reproduce the characteristics and structure of the original data. [EDPS] 68 Transparency Making AI system information made available to relevant stakeholders in a comprehensive, accessible and understandable manner [ISO/IEC 22989:2022(E)] 69 Trinity Models AI models focused on one language, task, and domain. 70 Understandability Ease with which users comprehend AI operations and outputs.
