                    - paragraph [ref=f155e776]: "Annexure III – IndiaAI Mission: Strategy and Status"
                    - paragraph [ref=f155e777]: The IndiaAI Mission is the Government of India’s flagship program to build a cohesive, strategic, and robust AI ecosystem.
                    - paragraph [ref=f155e778]: The IndiaAI Compute pillar focuses on creating a high-end, scalable AI computing ecosystem to deliver Compute-as-a-Service for India’s rapidly growing AI startups and research community. So far, over 34,000 GPUs have been made available at subsidized rates through the IndiaAI Compute portal, with an additional 4,000+ GPUs expected in the next phase of empanelment. The mission also plans to establish a government-controlled GPU cluster of about 3,000 GPUs to meet sovereign and strategic needs.
                    - paragraph [ref=f155e779]: The IndiaAI Application Development Initiative (IADI) is designed to foster the development and adoption of at least 25 impactful AI solutions that can drive large-scale socio-economic transformation. The first Innovation Challenge, launched in 2024, wherein thirty applications have advanced to the prototyping phase, with a second round of the challenge set to launch in collaboration with the Ministry of Education.
                    - paragraph [ref=f155e780]: AIKosh, the IndiaAI Datasets Platform, is envisioned as a unified data platform integrating datasets from government and non-government sources. Launched in beta in March 2025, it currently features over 874 datasets, 207 AI models, and more than 13 development toolkits. The platform has attracted over 265,000 visits, 6,000 registered users, and 13,000+ resource downloads. AIKosh prioritizes data quality scoring, robust search and filtering, Jupyter notebooks for analytics, and secure, permission-based access for contributors.
                    - paragraph [ref=f155e781]: The IndiaAI Foundation Models pillar underscores the importance of building India’s own large language models (LLMs) trained on Indian datasets and languages, to ensure sovereign capability and global competitiveness in generative AI. A funding model combining grants and equity support has been introduced, offering 40% of compute costs as grants and taking 60% as equity (via convertible debentures). From 506 proposals received, four startups (Sarvam AI, Soket AI, Gnani AI, and Gan AI) have been selected in the first phase to develop India’s foundation models.
                    - paragraph [ref=f155e782]: The IndiaAI FutureSkills pillar is a cornerstone of the mission’s human capital strategy, aiming to democratize AI education and build a robust talent pipeline across the country. The program will support 500 PhD fellows, 5,000 Master’s students, and 8,000 undergraduates through targeted funding. Research fellowships for PhD scholars are aligned with the Prime Minister’s Research Fellowship, offering support of up to ₹55 lakh per fellow. Over 200 students have received fellowships in the first year, with 26 partner institutes onboarding PhD students. Additionally, more than 570 AI and Data Labs are planned nationwide, with 27 labs already in progress and further approvals granted for ITIs and polytechnics across 27 states and UTs.
                    - paragraph [ref=f155e783]: The IndiaAI Startup Financing pillar addresses the critical need for risk capital across the entire lifecycle of AI startups, from prototyping to commercialization. This includes the IndiaAI Startups Global program, launched in collaboration with Station F (Paris) and HEC Paris, which aims to support 10 Indian AI startups in expanding into the European market. A call for proposals to establish state-level Centers of Excellence in AI has also received 29 submissions from 21 states and union territories.
                    - paragraph [ref=f155e784]: Finally, the Safe and Trusted AI pillar seeks to balance innovation with strong governance frameworks to ensure responsible AI adoption. Recognizing India’s diverse social, cultural, economic, and linguistic landscape, this pillar focuses on developing contextualized instruments of AI governance. The first Expression of Interest (EoI) selected eight projects addressing themes such as machine unlearning, bias mitigation, privacy-preserving machine learning, explainability, auditing tools, and governance testing frameworks. A second EoI round, focused on watermarking, ethical AI frameworks, risk assessment, stress testing tools, and deepfake detection, received 400+ applications. Plans are also underway to operationalise the IndiaAI Safety Institute under a hub-and-spoke model to address AI risks and safety challenges in collaboration with research institutions and industry partners.
                    - paragraph [ref=f155e785]: In addition, India is set to host the AI Impact Summit in February 2026, building on its role as co-chair of the AI Action Summit and continuing its leadership in shaping global AI discussions.
