                    - paragraph [ref=f155e973]:
                      - superscript [ref=f155e974]: "35"
                      - text: For the purpose of this survey, an institution was considered to have adopted AI if it has either deployed or is developing any AI systems at least one use case.
                    - paragraph [ref=f155e975]:
                      - superscript [ref=f155e976]: "36"
                      - text: "UCBs: Tier 1 - All unit UCBs and salary earners’ UCBs (irrespective of deposit size), and all other UCBs having deposits up to ₹100 crore; Tier 2 - UCBs with deposits more than ₹100 crore and up to ₹1000 crore; Tier 3 - UCBs with deposits more than ₹1000 crore and up to ₹10,000 crore."
                    - paragraph [ref=f155e977]:
                      - generic [ref=f155e978]:
                        - superscript [ref=f155e979]: "37"
                        - text: Predictive cross sell/up sell models, Customer lifetime value (CLTV) prediction model, Customer churn prediction model, Lead scoring model (prospective customer conversion), banner generation.
                    - paragraph [ref=f155e980]:
                      - superscript [ref=f155e981]: "38"
                      - text: Machine learning credit scoring models (personal loans, credit cards), Automated document data extraction (OCR/RPA for loan processing)
                    - paragraph [ref=f155e982]:
                      - superscript [ref=f155e983]: "39"
                      - text: AI driven threat intelligence platform (e.g., CloudSEK), AI enhanced security monitoring (Extended Detection and Response (XDR) platforms like Trend Micro Vision One), AI based network threat detection (e.g., Darktrace)
                    - paragraph [ref=f155e984]:
                      - superscript [ref=f155e985]: "40"
                      - text: SHapley Additive exPlanations (SHAP) is a technique used to quantify the contribution of each feature to a model's output by assigning it a specific value based on its impact on the prediction.
                    - paragraph [ref=f155e986]:
                      - superscript [ref=f155e987]: "41"
                      - text: Local Interpretable Model agnostic Explanations (LIME) is a technique that explains model predictions by creating simple, interpretable models that locally approximate the behaviour of complex machine learning models around a specific prediction.
