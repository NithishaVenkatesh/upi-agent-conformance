                    - paragraph [ref=f155e787]: Annexure IV – AI Specific Enhancements in RBI Master Directions
                    - text: Existing Regulation AI Risks Implicitly Covered under Suggestions for AI Specific Enhancements 1.
                    - link "RBI Guidelines on Outsourcing of Financial Services" [ref=f155e788] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/commonPerson/english/scripts/Notification.aspx?Id=40
                    - text: (i) Accountability for outsourced activities (ii) Risk management and governance of third-party services (i) Specific clauses addressing AI specific risks, including algorithmic bias, may be incorporated as applicable into the Outsourcing Agreement. (ii) Specific clauses setting out an obligation to disclose the use of AI by third-party vendors and their subcontractors may be incorporated, as applicable, into the Outsourcing Agreement. 2.
                    - link "Cyber Security Framework in Banks (2016)" [ref=f155e789] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/commonperson/english/scripts/Notification.aspx?Id=1721
                    - text: (i) Data confidentiality, integrity, and availability (ii) Incident reporting and response mechanisms (i) May include AI specific threats such as model poisoning and adversarial attacks in the risk assessments under Cyber Security Policy at para 5 of the framework. (ii) May establish protocols for monitoring and mitigating AI related cybersecurity incidents under para 14 of the said framework. 3.
                    - link "Guidelines on Digital Lending dated September 2, 2022" [ref=f155e790] [cursor=pointer]:
                      - /url: https://rbi.org.in/Scripts/NotificationUser.aspx?Id=12382&Mode=0
                    - text: (i) Data privacy and consent in digital lending (ii) Accountability of REs for third-party digital lending apps (i) May include providing transparency in AI driven credit assessments, including disclosure of use of AI under para 5 “Disclosures to borrowers” of the guidelines. (ii) May include implementation of fairness audits to detect and mitigate algorithmic biases under para 9 “Due diligence requirements with respect to LSPs” of the guidelines. 4.
                    - link "Master Circular on Customer Service in Banks (2015)" [ref=f155e791] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/commonman/English/Scripts/Notification.aspx?Id=1587
                    - text: (i) Customer rights and grievance redressal mechanisms (ii) Board level oversight of customer service (i) May include awareness to customer when interacting with AI systems under para 8 “Guidance to customers and Disclosure of Information” of the master circular. (ii) May include establishment of processes for customers to contest AI driven decisions under para 16 – “Dealing with Complaints and Improving Customer Relations” 5.
                    - link "Master Direction on Fraud Risk Management (2024)" [ref=f155e792] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12702
                    - text: (i) Framework for early warning signals and fraud detection (ii) Risk management policies approved by the Board (i) May encourage AI driven fraud detection mechanisms under Chapter III “Framework for Early Warning Signals for Detection of Frauds” (ii) May suggest to regularly test AI models for accuracy and bias in fraud detection under the same Chapter. 6.
                    - link "Master Direction on Information Technology Governance, Risk, Controls and Assurance Practices (2023)" [ref=f155e793] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12562
                    - text: (i) Broad IT governance (ii) Oversight of information systems and related risks (i) May include Access Control measures for the autonomous AI under para 19 (Access Control) of the Direction. 7.
                    - link "Master Direction on Outsourcing of Information Technology Services (2023)" [ref=f155e794] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/scripts/BS_ViewMasDirections.aspx?id=12486
                    - text: (i) Risk assessments and due diligence of IT service providers. (ii) Data protection and incident reporting obligations (i) May be required for the service providers to disclose use of AI in service delivery under para 16 Chapter V (Aspects to be considered in outsourcing agreement) (ii) May amend to include AI specific risk assessments under Chapter IV (Evaluation and Engagement of Service Providers)
                    - separator [ref=f155e795]
                    - paragraph [ref=f155e796]: Annexure V – Suggested Outline of Board Policy on AI
                    - paragraph [ref=f155e797]: This document outlines the aspects that an entity should cover while formulating its Board policy on AI. It may be customised to the organisation’s needs and complexity of use and aligned with the recommendations of the FREE-AI committee report.
                    - text: Sl. No. Section What needs to be covered 1 Purpose and Scope
                    - list [ref=f155e798]:
                      - listitem [ref=f155e799]:
                        - paragraph [ref=f155e800]: Define the role of AI in the organisation
                      - listitem [ref=f155e801]:
                        - paragraph [ref=f155e802]: Identify stakeholders (including, internal departments, external vendors, etc.)
                      - listitem [ref=f155e803]:
                        - paragraph [ref=f155e804]: State the desired outcomes of AI usage by the organisation
                    - text: "2 Principles Set out the principles in alignment with the FREE-AI Sutras after taking into account the organisation’s needs. 3 Governance Structure and Roles Define the AI governance structure to address:"
                    - list [ref=f155e805]:
                      - listitem [ref=f155e806]:
                        - paragraph [ref=f155e807]: decision-making and accountability,
                      - listitem [ref=f155e808]:
                        - paragraph [ref=f155e809]: oversight and escalation
                      - listitem [ref=f155e810]:
                        - paragraph [ref=f155e811]: grievance redressal mechanism
                    - text: 4 AI Life cycle management
                    - list [ref=f155e812]:
                      - listitem [ref=f155e813]:
                        - paragraph [ref=f155e814]: Ensure rigorous testing and internal product approval processes before deploying any AI application.
                      - listitem [ref=f155e815]:
                        - paragraph [ref=f155e816]: Conduct continuous red-teaming exercises throughout the AI lifecycle to identify and mitigate emerging risks.
                      - listitem [ref=f155e817]:
                        - paragraph [ref=f155e818]: List key controls and responsibilities to ensure AI systems are developed and managed in a safe, ethical, and accountable manner through all stages of the AI lifecycle.
                    - text: 5 Data Governance and Management
                    - list [ref=f155e819]:
                      - listitem [ref=f155e820]:
                        - paragraph [ref=f155e821]: Define the data governance framework for sourcing, cleaning, anonymization, encryption, sharing and purging of data.
                      - listitem [ref=f155e822]:
                        - paragraph [ref=f155e823]: Address bias detection, synthetic data generation and validation to ensure data integrity and responsible use.
                      - listitem [ref=f155e824]:
                        - paragraph [ref=f155e825]: Adhere to open data standards and meta data standards.
                    - text: "6 Risk Management and Controls Institute processes to identify and mitigate AI risks. Consider the following aspects before deployment:"
                    - list [ref=f155e826]:
                      - listitem [ref=f155e827]:
                        - paragraph [ref=f155e828]: Are the decisions and outputs of the AI application fair, inclusive, accurate and transparent?
                      - listitem [ref=f155e829]:
                        - paragraph [ref=f155e830]: Does the AI application introduce new cybersecurity risks or exacerbate the existing cybersecurity risks?
                      - listitem [ref=f155e831]:
                        - paragraph [ref=f155e832]: Do customers have adequate recourse for all decisions and outputs of the AI application that could adversely affect their interests?
                      - listitem [ref=f155e833]:
                        - paragraph [ref=f155e834]: Does the application adequately convey customers that they are interacting with an AI system?
                      - listitem [ref=f155e835]:
                        - paragraph [ref=f155e836]: Does the AI application share or reveal confidential/personal/sensitive information in its interactions
                    - text: 7 Third-Party and Vendor Management Define the scope, responsibility, and liability of third-party vendors. 8 Policy Review The AI policy may be reviewed at least once annually to reflect new regulatory requirements and technological developments.
