        - generic [ref=f59e386]:
          - heading "What is Pine Labs Payments Protocol (P3P)?" [level=2] [ref=f59e387]
          - paragraph [ref=f59e388]: Pine Labs Payments Protocol (P3P) is an open payments protocol that enables AI agents, merchants, and autonomous systems to securely initiate, authorize, and execute payments without a human at the point of transaction.
          - paragraph [ref=f59e389]: P3P uses standard HTTP interfaces to let participants discover services, create orders, obtain delegated authorization, process payments, and exchange verifiable receipts. A consent-driven mandate model gives users upfront control over agent spending while enabling fully autonomous commerce.
          - link "Quickstart Guide" [ref=f59e390] [cursor=pointer]:
            - /url: p3p/quickstart
          - heading "Who Uses Pine Labs Payments Protocol (P3P)?" [level=2] [ref=f59e391]
          - paragraph [ref=f59e392]: P3P is designed for merchants, AI agents, applications, and autonomous systems that need to support secure, consent-driven machine payments.
          - table [ref=f59e394]:
            - rowgroup [ref=f59e395]:
              - row [ref=f59e396]:
                - columnheader "Participant" [ref=f59e397]
                - columnheader "What they do" [ref=f59e398]
            - rowgroup [ref=f59e399]:
              - row [ref=f59e400]:
                - cell [ref=f59e401]:
                  - strong [ref=f59e402]: Merchants
                - cell "Enable AI agents and applications to securely pay for products, services, subscriptions, and digital resources." [ref=f59e403]
              - row [ref=f59e404]:
                - cell [ref=f59e405]:
                  - strong [ref=f59e406]: AI Agents & Applications
                - cell "Execute payments on behalf of users within approved authorization and spending limits." [ref=f59e407]
              - row [ref=f59e408]:
                - cell [ref=f59e409]:
                  - strong [ref=f59e410]: Users
                - cell "Control how, when, and how much agents can spend on their behalf." [ref=f59e411]
              - row [ref=f59e412]:
                - cell [ref=f59e413]:
                  - strong [ref=f59e414]: Pine Labs
                - cell "Coordinates payment authorization, transaction processing, receipt exchange, and settlement across participants." [ref=f59e415]
          - heading "How P3P Works?" [level=2] [ref=f59e416]
          - heading "Key Features" [level=2] [ref=f59e418]
          - generic [ref=f59e419]:
            - generic [ref=f59e420]:
              - heading "Agent-Native Payments" [level=4] [ref=f59e426]
              - paragraph [ref=f59e427]: P3P lets AI agents, autonomous pipelines, and embedded commerce systems initiate and complete transactions without requiring a human at the point of payment.
            - generic [ref=f59e428]:
              - heading "Standardized Communication" [level=4] [ref=f59e432]
              - paragraph [ref=f59e433]: A single HTTP-native protocol for payment authorization, capture, and receipt exchange that works consistently across agents, merchants, and payment providers.
            - generic [ref=f59e434]:
              - heading "Secure Payment Authorization" [level=4] [ref=f59e439]
              - paragraph [ref=f59e440]: Every transaction is scoped and bounded at issuance. Payment tokens are tied to a specific resource, amount, and expiry. They cannot be replayed, redirected, or reused.
            - generic [ref=f59e441]:
              - heading "Multi-Payment Method Support" [level=4] [ref=f59e445]
              - paragraph [ref=f59e446]:
                - text: Currently live on
                - strong [ref=f59e447]: UPI ReservePay
                - text: and
                - strong [ref=f59e448]: Cards
                - text: . Net Banking, Wallets, and EMI options are on the roadmap. The P3P challenge and receipt format remains the same across all rails.
            - generic [ref=f59e449]:
              - heading "Real-Time Status Tracking" [level=4] [ref=f59e454]
              - paragraph [ref=f59e455]: Track payment lifecycle events and transaction updates in real time. Every state change, from challenge to capture to receipt, is observable and auditable.
            - generic [ref=f59e456]:
              - heading "Verifiable Receipts" [level=4] [ref=f59e461]
              - paragraph [ref=f59e462]: Every completed transaction returns a cryptographically verifiable receipt. Receipts serve as proof of payment for audit trails, compliance, and dispute resolution.
          - heading "Supported Use Cases" [level=2] [ref=f59e463]
          - generic [ref=f59e464]:
            - generic [ref=f59e465]:
              - heading "AI Shopping Assistants" [level=4] [ref=f59e471]
              - paragraph [ref=f59e472]: Enable AI assistants to complete purchases on behalf of customers by selecting, authorizing, and confirming transactions without manual intervention at each step.
            - generic [ref=f59e473]:
              - heading "Marketplace Transactions" [level=4] [ref=f59e479]
              - paragraph [ref=f59e480]: Support machine-to-machine commerce across marketplace platforms, where client and server systems interact directly through the P3P protocol.
            - generic [ref=f59e481]:
              - heading "Embedded Commerce" [level=4] [ref=f59e486]
              - paragraph [ref=f59e487]: Integrate payment execution directly into applications and workflows, so purchasing happens as a native step in the process rather than a redirect to an external checkout.
            - generic [ref=f59e488]:
              - heading "Autonomous Procurement" [level=4] [ref=f59e492]
              - paragraph [ref=f59e493]: Automate purchasing flows for both B2B and B2C scenarios, where systems initiate and complete transactions based on predefined rules and approved spending limits.
          - heading "Next Steps" [level=2] [ref=f59e494]
