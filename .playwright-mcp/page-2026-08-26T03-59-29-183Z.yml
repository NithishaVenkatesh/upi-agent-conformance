                            - link "6. Principles for authentication of digital payment transactions" [ref=f75e121] [cursor=pointer]:
                              - /url: "#S6"
                        - row [ref=f75e122]:
                          - cell [ref=f75e123]:
                            - link "7. Interoperability / Open Access" [ref=f75e124] [cursor=pointer]:
                              - /url: "#S7"
