                  - cell [ref=f75e96]:
                    - paragraph [ref=f75e97]: RBI/2025-26/79 CO.DPSS.POLC.No. S 668/02-14-015/2025-2026
                    - paragraph [ref=f75e98]: September 25, 2025
                    - paragraph [ref=f75e99]: Reserve Bank of India (Authentication mechanisms for digital payment transactions) Directions, 2025
                    - table [ref=f75e100]:
                      - rowgroup [ref=f75e101]:
                        - row [ref=f75e102]:
                          - cell "Index" [ref=f75e103]
