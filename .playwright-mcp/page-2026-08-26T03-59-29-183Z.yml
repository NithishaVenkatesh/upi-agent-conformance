                        - row [ref=f75e134]:
                          - cell [ref=f75e135]:
                            - link "11. Repeal" [ref=f75e136] [cursor=pointer]:
                              - /url: "#S11"
                        - row [ref=f75e137]:
                          - cell [ref=f75e138]:
                            - link "Annexure-1" [ref=f75e139] [cursor=pointer]:
                              - /url: "#AN1"
                        - row [ref=f75e140]:
                          - cell [ref=f75e141]:
                            - link "Annexure-2" [ref=f75e142] [cursor=pointer]:
                              - /url: "#AN2"
                    - paragraph [ref=f75e143]: 1. Introduction
                    - paragraph [ref=f75e144]: All digital payment transactions in India are required to meet the norm of two factors of authentication. While no specific factor was mandated for authentication, the digital payments ecosystem has primarily adopted SMS-based One Time Password (OTP) as the additional factor.
                    - paragraph [ref=f75e145]:
                      - text: As announced in
                      - link "Statement on Developmental and Regulatory Policies dated February 08, 2024" [ref=f75e146] [cursor=pointer]:
                        - /url: https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=57276
                      - text: ", in order to enable the payments ecosystem to leverage the technological advancements for implementing alternative authentication mechanisms, it has been decided to publish Reserve Bank of India (Authentication mechanisms for digital payment transactions) Directions, 2025 (hereinafter referred to as “Directions”). The directions provide the broad principles which shall be complied with by all the participants in the payment chain, while using a form of authentication."
                    - paragraph [ref=f75e147]:
                      - text: While these directions are applicable only to domestic transactions, in order to provide a similar level of safety for online international transactions undertaken using cards issued in India, the directions also incorporate necessary instructions for specific cross-border card transactions, in line with the
                      - link [ref=f75e148] [cursor=pointer]:
                        - /url: https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=59693
                        - text: Statement on Developmental and Regulatory Policies
                        - strong [ref=f75e149]
                        - text: dated February 07, 2025
                      - text: .
                    - paragraph [ref=f75e150]: These directions are issued under Section 18 read with Section 10(2) of the Payment and Settlement Systems (PSS) Act, 2007 (Act 51 of 2007).
                    - paragraph [ref=f75e151]: 2. Short title
                    - paragraph [ref=f75e152]: These directions shall be called Reserve Bank of India (Authentication mechanisms for digital payment transactions) Directions, 2025
                    - paragraph [ref=f75e153]: 3. Effective Date
                    - paragraph [ref=f75e154]: All Payment System Providers and Payment System Participants, including banks and non-bank entities, shall ensure compliance with these directions by April 01, 2026, unless indicated otherwise for any specific provision herein.
                    - paragraph [ref=f75e155]: 4. Applicability
                    - list [ref=f75e156]:
                      - listitem [ref=f75e157]:
                        - paragraph [ref=f75e158]: These directions shall be applicable to all Payment System Providers and Payment System Participants (banks and non-banks).
                      - listitem [ref=f75e159]:
                        - paragraph [ref=f75e160]: These directions apply to all domestic digital payment transactions, unless specifically exempted otherwise.
                    - paragraph [ref=f75e161]: 5. Definitions
                    - paragraph [ref=f75e162]: "I. Unless the context otherwise requires, the following terms shall bear the meanings assigned to them as below:"
                    - list [ref=f75e163]:
                      - listitem [ref=f75e164]:
                        - paragraph [ref=f75e165]: "Authentication: Process of validating and confirming the credentials of the customer who is originating the payment instruction."
                      - listitem [ref=f75e166]:
                        - paragraph [ref=f75e167]: "Card Not Present (CNP) transaction: A transaction where the card and acceptance infrastructure are not present in close proximity while making the transaction."
                      - listitem [ref=f75e168]:
                        - paragraph [ref=f75e169]: "Card Present transaction: A transaction that is carried out through the physical use of card at the point of transaction."
                      - listitem [ref=f75e170]:
                        - paragraph [ref=f75e171]: "Cross-border CNP transaction: A payment instruction wherein the card, issued by an Indian issuer, is used for undertaking a payment transaction favouring a merchant acquired by an overseas acquirer. For such transactions, outflow of foreign exchange is envisaged."
                      - listitem [ref=f75e172]:
                        - paragraph [ref=f75e173]: Digital Payment Transaction shall have the same meaning as “Electronic Funds Transfer” as defined in the PSS Act, 2007.
                      - listitem [ref=f75e174]:
                        - paragraph [ref=f75e175]: "Factor of Authentication: Credential of the customer which is used for authentication. The factors of authentication can be from “something the user has”, “something the user knows” or “something the user is” and may comprise, inter-alia, password, SMS based OTP, passphrase, PIN, card hardware, software token, fingerprint, or any other form of biometrics (device native or Aadhaar based)."
                      - listitem [ref=f75e176]:
                        - paragraph [ref=f75e177]: "Issuer: A bank or a non-bank that maintains the customer’s account from which payment is made, such as a deposit account or a credit line or a prepaid instrument."
                    - paragraph [ref=f75e178]: II. Words and expressions used but not defined in these directions and defined in the PSS Act, 2007 shall have the meanings assigned to them in that Act.
                    - paragraph [ref=f75e179]: 6. Principles for authentication of digital payment transactions
                    - paragraph [ref=f75e180]: "The technology and process deployed for authenticating a payment instruction by the Payment System Provider / Payment System Participant(s) shall comply with the following principles:"
                    - paragraph [ref=f75e181]: a. Minimum two factors of authentication
                    - paragraph [ref=f75e182]:
                      - text: All digital payment transactions shall be authenticated by at least two distinct factors of authentication as defined in paragraph-5(f), unless exempted. The list of exemptions which are currently in force are listed in
                      - link "Annexure-1" [ref=f75e183] [cursor=pointer]:
                        - /url: "#AN1"
                      - text: .
                    - paragraph [ref=f75e184]: Note - Issuers may, at their discretion, offer a choice of authentication factors to their customers in compliance with these directions.
                    - paragraph [ref=f75e185]: b. At least one of the factors to be dynamic
                    - paragraph [ref=f75e186]: It shall be ensured that for digital payment transactions, other than card present transactions, at least one of the factors of authentication is dynamically created or proven, i.e., the proof of possession of the factor, being sent as part of the transaction, is unique to that transaction.
                    - paragraph [ref=f75e187]: c. Robust
                    - paragraph [ref=f75e188]: The factor of authentication shall be such that compromise of one factor does not affect reliability of the other.
                    - paragraph [ref=f75e189]: 7. Interoperability / Open Access
                    - paragraph [ref=f75e190]: System Providers and System Participants shall offer authentication or tokenisation service that is accessible to all the applications / token requestors functioning in that operating environment for all use cases / channels or token storage mechanisms.
                    - paragraph [ref=f75e191]: Note –
                    - list [ref=f75e192]:
                      - listitem [ref=f75e193]:
                        - paragraph [ref=f75e194]: Operating environment includes device hardware, operating system, etc.
                      - listitem [ref=f75e195]:
                        - paragraph [ref=f75e196]:
                          - text: The terms, ‘tokenisation’, ‘token requestor’, ‘use cases/channels’ and ‘token storage mechanisms’ shall have the same meaning as assigned to them in the
                          - link "RBI directions on “Tokenisation – Card Transactions” dated January 08, 2019" [ref=f75e197] [cursor=pointer]:
                            - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11449&Mode=0
                          - text: ", as amended from time to time."
                    - paragraph [ref=f75e198]: 8. Risk based approach
                    - paragraph [ref=f75e199]: Issuers may, in line with their internal risk management policies, identify transactions for evaluation against behavioural / contextual parameters such as transaction location, user behaviour patterns, device attributes, historical transaction profile, etc. Based on the perceived risk associated with the transaction, additional checks beyond the minimum two-factor authentication may be resorted to. Issuers may also explore using DigiLocker as a platform for notification and confirmation for high-risk transactions.
                    - paragraph [ref=f75e200]: 9. Responsibility of the issuer
                    - list [ref=f75e201]:
                      - listitem [ref=f75e202]:
                        - paragraph [ref=f75e203]: An issuer shall ensure the robustness and integrity of the authentication mechanism before deployment.
                      - listitem [ref=f75e204]:
                        - paragraph [ref=f75e205]: If any loss arises out of transactions effected without complying with these directions, the issuer shall compensate the customer for the loss in full without demur.
                      - listitem [ref=f75e206]:
                        - paragraph [ref=f75e207]: Issuers shall ensure adherence to the provisions of Digital Personal Data Protection Act, 2023.
                    - paragraph [ref=f75e208]: 10. Cross-border transactions
                    - list [ref=f75e209]:
                      - listitem [ref=f75e210]:
                        - paragraph [ref=f75e211]: The directions outlined above are not applicable to cross-border digital payment transactions. However, card issuers shall, by October 01, 2026, put in place a mechanism to validate non-recurring, cross-border card not present (CNP) transactions, where request for authentication is raised by an overseas merchant or overseas acquirer. To ensure compliance, card issuers shall register their Bank Identification Numbers (BINs) with card networks.
                      - listitem [ref=f75e212]:
                        - paragraph [ref=f75e213]: Further, a risk-based mechanism for handling all cross-border CNP transactions shall also be put in place by card issuers by October 01, 2026.
                    - paragraph [ref=f75e214]: 11. Repeal
                    - paragraph [ref=f75e215]:
                      - text: The list of circulars / directions that are repealed are listed in
                      - link "Annexure-2" [ref=f75e216] [cursor=pointer]:
                        - /url: "#AN2"
                      - text: .
                    - separator [ref=f75e217]
                    - paragraph [ref=f75e218]: Annexure-1
                    - paragraph [ref=f75e219]: "(Reference: CO.DPSS.POLC.No. S 668/02-14-015/2025-2026 dated September 25, 2025)"
                    - paragraph [ref=f75e220]: Existing exemptions from the requirement of at least two factors of authentication under paragraph-6(a) of these directions. Any subsequent additions / modifications made, from time to time, will also be applicable.
                    - text: S. No. Use case Existing directions 1. Small-value Contactless Card transactions
                    - link "DPSS.CO.PD No.752/02.14.003/2020-21 dated December 04, 2020" [ref=f75e221] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11999&Mode=0
                    - text: 2. Recurring transactions (other than the first) under the e-mandate framework
                    - link "DPSS.CO.PD.No.447/02.14.003/2019-20 dated August 21, 2019" [ref=f75e222] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11668&Mode=0
                    - link "DPSS.CO.PD No.754/02.14.003/2020-21 dated December 04, 2020" [ref=f75e223] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12002&Mode=0
                    - link "CO.DPSS.POLC.No.S-882/02.14.003/2023-24 dated December 12, 2023" [ref=f75e224] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12570&Mode=0
                    - text: 3. Select Prepaid Instruments such as PPI-MTS and Gift PPIs
                    - link "CO.DPSS.POLC.No.S-479/02.14.006/2021-22 dated August 27, 2021" [ref=f75e225] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12156&Mode=0
                    - text: 4. NETC transactions
                    - link "DPSS.CO.PD No.1227/02.31.001/2019-20 dated December 30, 2019" [ref=f75e226] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11769&Mode=0
                    - text: 5. Small value digital payments in offline mode
                    - link "CO.DPSS.POLC.No.S1264/02-14-003/2021-2022 dated January 03, 2022" [ref=f75e227] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12215&Mode=0
                    - text: 6. Travel bookings, including Global Distribution System / IATA, through commercial / corporate cards. Letter dated April 17, 2012 (DPSS.CO.PD.No.1910/02.14.003/2011-12) issued to Indian Bank’s Association
                    - separator [ref=f75e228]
                    - paragraph [ref=f75e229]: Annexure-2
                    - paragraph [ref=f75e230]: "(Reference: CO.DPSS.POLC.No. S 668/02-14-015/2025-2026 dated September 25, 2025)"
                    - paragraph [ref=f75e231]: "List of circulars / directions that are repealed:"
