                      - text: ) / National Cyber Crime Helpline (1930) with reference / complaint no. _________________ (copy enclosed) regarding the fraudulent electronic banking transaction(s) in my bank account / credit card no. _______________________.
                    - paragraph [ref=f153e233]: 2. I understand that compensation for small value fraudulent electronic banking transactions is available to an individual only once and declare that I have not previously availed such a compensation from any bank.
                    - paragraph [ref=f153e234]: 3. As per the advice dated ________________ received from the bank, an amount of ₹__________________ (Rupees ____________________________________ only) may please be credited to my aforesaid bank account / credit card.
                    - paragraph [ref=f153e235]: 4. I understand that in case of my claim being established as ‘false’ or ‘repeated claims’ in future, I will be liable to refund the compensation received.
                    - paragraph [ref=f153e236]: 5. I authorise the bank to debit the additional amount received by me over and above the amount lost in the fraudulent electronic banking transaction(s) if any subsequent recovery is credited to my account.
