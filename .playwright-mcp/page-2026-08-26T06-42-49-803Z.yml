                  - link "UPI Reserve Pay" [ref=f777e75] [cursor=pointer]:
                    - /url: /product/upi-reserve-pay
                - listitem [ref=f777e76]: Overview
            - heading "UPI Reserve Pay" [level=1] [ref=f777e80]
      - generic [ref=f777e84]:
        - paragraph [ref=f777e85]:
          - text: UPI Reserve Pay lets you reserve money in your account once and use it for multiple payments later. Think of it as putting money aside for future purchases - you reserve the amount upfront, but only pay when you actually buy something or receive a service.
          - strong [ref=f777e86]: What is the product solving
          - text: Today, when you shop online or book services, you either have to pay everything upfront or choose cash-on-delivery to pay later. UPI Reserve Pay solves this wherein merchants get assurance of availability of funds; you retain funds in-account until you actually receive the order.
          - strong [ref=f777e87]: Transaction Limits
        - list [ref=f777e88]:
          - listitem [ref=f777e89]: "Maximum amount you can reserve: ₹10,000 per block"
          - listitem [ref=f777e90]: "Maximum duration for the reserve: 90 days"
        - paragraph [ref=f777e91]:
          - strong [ref=f777e92]: Transaction Process Flow
          - strong [ref=f777e93]: "Setting up your reserve:"
        - list [ref=f777e94]:
          - listitem [ref=f777e95]: Choose UPI Reserve Pay when shopping on a merchant's app
          - listitem [ref=f777e96]: Enter the amount you want to reserve and set how long it should stay reserved within the allowed limits
          - listitem [ref=f777e97]: Choose the UPI App to initiate UPI Reserve Pay set up
          - listitem [ref=f777e98]: Validate the details and confirm with your UPI PIN - this reserves the money in your selected account
          - listitem [ref=f777e99]: The merchant gets confirmation that your money is reserved
        - paragraph [ref=f777e100]:
          - strong [ref=f777e101]: Making payments
          - text: ":"
        - list [ref=f777e102]:
          - listitem [ref=f777e103]: When you order goods or services, and select UPI Reserve Pay to make payments the merchant shall be able to deduct money from your reserved amount
          - listitem [ref=f777e104]: You get notified each time money is deducted
          - listitem [ref=f777e105]: You can track all payments in your Merchant as well as UPI app
        - paragraph [ref=f777e106]:
          - strong [ref=f777e107]: Managing your reserve
          - text: ":"
        - list [ref=f777e108]:
          - listitem [ref=f777e109]: You can modify the reserved amount or cancel it anytime before the expiry
          - listitem [ref=f777e110]: Any unused money gets released back to your account when the reserve expires or is cancelled.
