          - heading "How we use cookies and your consent" [level=2] [ref=f730e501]
          - generic [ref=f730e502]: We use cookies and similar technologies (‘Cookies’) on our websites to improve them, measure their performance, understand our audience and enhance the user experience. On some sites, we also use Cookies to show ads based on users’ browsing activities and interests on the site and other sites. Click ‘Manage Cookies’ below to learn what Cookies we use on this site and why. You can always change your consent preferences using the ‘Manage Cookies’ tool at the bottom of the screen (available as a link instead of a button on some sites). This includes rejecting some or all Cookies, except those that are strictly necessary for the site to work.
