        - generic [ref=f68e74]:
          - generic [ref=f68e76]:
            - paragraph [ref=f68e77]:
              - text: Fintech company Razorpay, the National Payments Corporation of India (NPCI), and OpenAI have come together to launch agentic payments on ChatGPT. In a
              - link "press release" [ref=f68e78] [cursor=pointer]:
                - /url: https://www.medianama.com/wp-content/uploads/2025/10/Press-Release_Razorpay-NPCI-and-OpenAI-Come-Together-to-Launch-Agentic-Payments-Ushering-in-.pdf
              - text: discussing the development, Razorpay announced that it will facilitate these agentic payment services via Unified payments Interface (UPI) Circle and UPI Reserve Pay. Axis Bank and Airtel Payments Bank are the banking partners for this service, and BigBasket is the first business to allow customers to use agentic payments to make transactions on its platform. The agentic payments service is currently in a pilot stage.
            - paragraph [ref=f68e79]:
              - text: For context, agentic payments allow people to use AI to make financial transactions without ever leaving the AI chatbot. Customers can conduct a
              - link "one-time authorization" [ref=f68e80] [cursor=pointer]:
                - /url: https://razorpay.com/m/agentic-payments/
              - text: ", approve a spending limit upfront, and delegate payments to an AI model. For example, Razorpay explained, a customer can search for ingredients of a recipe on ChatGPT, which will then search BigBasket’s catalogue, present product options, and place the order via Razorpay’s payment stack with a single confirmation."
            - paragraph [ref=f68e81]: “Users retain full control with real-time tracking and instant revocation, ensuring a secure and user-first shopping experience,” the company explained. It added that, in the future, AI agents can be enabled with payment credentials to autonomously complete transactions on behalf of users in a safe, secure, and user-controlled manner.
            - heading "The growing discourse around agentic shopping and payments:" [level=3] [ref=f68e82]
            - paragraph [ref=f68e83]:
              - text: While a first for India, the discourse around agentic payments and shopping is certainly not new. In April this year,
              - link "Visa and Mastercard" [ref=f68e84] [cursor=pointer]:
                - /url: https://www.medianama.com/2025/05/223-ai-payments-india-visa-mastercard-legal-gaps/
              - text: rolled out agentic payments in partnership with firms like Microsoft, OpenAI, and the International Business Machines Corporation (IBM). Both Visa and Mastercard created their own agentic payment systems, which relied on tokenized credentials to process payments as opposed to card details. The credentials help users verify their identities, enforce spending limits, and process payments securely without exposing sensitive data.
            - paragraph [ref=f68e85]:
              - text: While fintechs seem eager for agentic payment and shopping experiences, others believe such experiences are still far away. “I think this notion of an agent just going and buying all the things for you without you doing anything, I think that’s going to be a very, very long cycle for that to play out, both in terms of how users think about it, where users aren’t going to be ready to just let something go, run off, and do everything for them, save for maybe some very utilitarian journeys,” Pinterest CEO Bill Ready
              - link "mentioned" [ref=f68e86] [cursor=pointer]:
                - /url: https://www.medianama.com/2025/08/223-ai-shopping-agents-pinterest-ceo/
              - text: during the company’s earnings call for the quarter ending June 2025.
            - heading "Concerns around agentic shopping and payments:" [level=3] [ref=f68e87]
            - paragraph [ref=f68e88]:
              - text: In a conversation with
              - link "MediaNama earlier this year" [ref=f68e89] [cursor=pointer]:
                - /url: https://www.medianama.com/2025/05/223-ai-payments-india-visa-mastercard-legal-gaps/
              - text: ", Kiran Nambiar, co-founder and CEO of MYfi by TIFIN, argued that AI systems should act more as co-pilots rather than autonomous decision-makers. Discussing how informed consent should work for processing agentic transactions, he explained that companies need to replicate the consents and confirmations a user would have with a trusted human assistant when using an AI assistant. “Replicating these behaviours in agentic systems is a good baseline—but not sufficient. True traceability is critical: every decision made by the AI agent should be logged, along with the rationale. This ensures both accountability and the opportunity for system improvement,” he added. Nambiar further pointed out that users should always have the final say before high-impact actions like financial transactions."
            - paragraph [ref=f68e90]:
              - text: During a
              - link "MediaNama discussion last year" [ref=f68e91] [cursor=pointer]:
                - /url: https://www.medianama.com/2024/07/223-who-is-liable-for-the-decisions-of-ai-agents-nama/
              - text: ", we mentioned a 2017 example of Amazon Alexa hearing its name on the local news and ordering dollhouses based on a statement made by the news anchor. These kinds of mistakes are likely to occur as AI agents begin to autonomously complete transactions on behalf of a customer. Despite a very active debate, attendees in our discussion did not arrive at any conclusion on liability in agentic decision-making. Some argued that the developers who programmed the agent to process such transactions would be liable, while others argued that user negligence also plays a key role in such mistakes. One significant point that attendees highlighted when discussing liability for agentic decisions was the reversibility of the decision. Thus, agentic purchases that can be easily resolved by returning items could have lower liability than decisions that cannot be reversed."
