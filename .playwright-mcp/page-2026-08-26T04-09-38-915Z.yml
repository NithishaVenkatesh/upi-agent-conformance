                    - link "About the Universal Commerce Protocol (UCP) and UCP-powered checkout feature on Google" [ref=f187e82] [cursor=pointer]:
                      - /url: /merchants/answer/16837055
              - generic [ref=f187e83]:
                - heading "About the Universal Commerce Protocol (UCP) and UCP-powered checkout feature on Google" [level=1] [ref=f187e84]
                - generic [ref=f187e85]:
                  - generic [ref=f187e87]:
                    - paragraph [ref=f187e88]: This article only applies to products with eligibility in the United States, Canada, and Australia, and for participating merchants and partners. You may see this checkout experience soon on specific surfaces such as AI Mode in Search and Gemini.
                    - region "alert" [ref=f187e89]:
                      - generic [ref=f187e91]:
                        - strong [ref=f187e92]: Note
                        - text: ": The checkout feature enabled by UCP is available for select merchants at this time. If you'd like to express interest in participating, make sure you meet the following"
                        - link "requirements Opens in new window" [ref=f187e93] [cursor=pointer]:
                          - /url: https://developers.google.com/merchant/ucp
                        - text: and then fill out the form
                        - link "here. Opens in new window" [ref=f187e94] [cursor=pointer]:
                          - /url: https://support.google.com/merchants/contact/ucp_integration_interest
                    - heading "About the Universal Commerce Protocol (UCP)" [level=2] [ref=f187e95]
                    - paragraph [ref=f187e96]:
                      - text: The
                      - link "Universal Commerce Protocol Opens in new window" [ref=f187e97] [cursor=pointer]:
                        - /url: http://ucp.dev
                      - text: is a new open standard for agentic commerce that enables agents and systems to work together across the commerce ecosystem. It works across the entire shopping journey from discovery and buying to post-purchase support. UCP establishes a common language for agents and systems to operate together across consumer surfaces, businesses, and payment providers. The protocol is compatible with major industry protocols such as Agent2Agent (
                      - link "A2A Opens in new window" [ref=f187e98] [cursor=pointer]:
                        - /url: https://a2a-protocol.org/latest/
                      - text: ), Agent Payments Protocol (
                      - link "AP2 Opens in new window" [ref=f187e99] [cursor=pointer]:
                        - /url: https://ap2-protocol.org/
                      - text: ), and Model Context Protocol (
                      - link "MCP Opens in new window" [ref=f187e100] [cursor=pointer]:
                        - /url: https://modelcontextprotocol.io/docs/getting-started/intro
                      - text: ).
                    - heading "About the checkout feature powered by UCP" [level=2] [ref=f187e101]
                    - paragraph [ref=f187e102]:
                      - text: By
                      - link "integrating with UCP Opens in new window" [ref=f187e103] [cursor=pointer]:
                        - /url: https://developers.google.com/merchant/ucp
                      - text: ", you can implement a checkout button on eligible product listings in AI Mode in Google Search and on Gemini."
                    - list [ref=f187e104]:
                      - listitem [ref=f187e105]: • You will remain the seller of record and may be able to customize the integration to preserve your specific checkout requirements and needs.
                      - listitem [ref=f187e106]: • Customers can checkout quickly with Google Pay, using payment methods and shipping information already saved in Google Wallet. Customers will remain in the secure Google Pay flow, which eliminates additional steps in the checkout process and may help boost confidence and reduce cart abandonment.
                    - paragraph [ref=f187e107]
                    - generic [ref=f187e109]:
                      - heading "Frequently asked questions" [level=2] [ref=f187e110]
                      - paragraph [ref=f187e111]:
                        - strong [ref=f187e112]: How can I implement the Universal Commerce Protocol (UCP)?
                      - paragraph [ref=f187e113]:
                        - text: The protocol will be available in phases. To participate in the early access program, make sure that you meet the following
                        - link "requirements Opens in new window" [ref=f187e114] [cursor=pointer]:
                          - /url: https://developers.google.com/merchant/ucp
                        - text: . Then, submit this
                        - link "interest form Opens in new window" [ref=f187e115] [cursor=pointer]:
                          - /url: https://support.google.com/merchants/contact/ucp_integration_interest
                        - text: ", and complete the required"
                        - link "technical implementation Opens in new window" [ref=f187e116] [cursor=pointer]:
                          - /url: https://developers.google.com/merchant/ucp/guides
                        - text: . Only product listings using the native_commerce(checkout_eligibility) product attribute will display the “Buy” button for this checkout experience. See detailed
                        - link "product data implementation. Opens in new window" [ref=f187e117] [cursor=pointer]:
                          - /url: https://developers.google.com/merchant/ucp/guides/merchant-center
                        - link "Learn more about how to onboard to the Universal Commerce Protocol in Merchant Center Opens in new window" [ref=f187e118] [cursor=pointer]:
                          - /url: https://support.google.com/merchants/answer/16992327
                      - paragraph [ref=f187e119]:
                        - strong [ref=f187e120]: How does UCP relate to the agentic checkout feature?
                      - paragraph [ref=f187e121]:
                        - text: Google’s
                        - link "agentic checkout feature Opens in new window" [ref=f187e122] [cursor=pointer]:
                          - /url: https://blog.google/products/shopping/agentic-checkout-holiday-ai-shopping/
                        - text: buys things on the customer’s behalf directly on a merchant’s website at the customer’s direction.
                        - link "UCP Opens in new window" [ref=f187e123] [cursor=pointer]:
                          - /url: https://ucp.dev
                        - text: is the open protocol which standardizes the programmatic exchange of information (via API, MCP or A2A) between the AI Agent and the Merchant’s backend to enable a broad set of commerce journeys including product discovery and checkout on Google AI Mode and Gemini.
                      - paragraph [ref=f187e124]:
                        - strong [ref=f187e125]: What is the difference between the existing
                        - link [ref=f187e126] [cursor=pointer]:
                          - /url: https://support.google.com/merchants/answer/13945960
                          - strong [ref=f187e127]: checkout button
                          - text: Opens in new window
                        - strong [ref=f187e128]: and this new checkout experience?
                      - paragraph [ref=f187e129]: With the existing checkout button, the transaction occurs on your site. With the new checkout experience enabled, the checkout happens directly on Google’s surfaces while keeping you the merchant of record.
                      - paragraph [ref=f187e130]:
                        - strong [ref=f187e131]: What kind of payment credentials are supported by UCP?
                      - paragraph [ref=f187e132]: Currently, the feature uses standard Funding Primary Account Numbers (FPANs) that users have stored on their Google Wallet. More forms of payments may become available in the future.
                      - paragraph [ref=f187e133]:
                        - strong [ref=f187e134]: Do I need to enable the Google Pay API buy button to participate?
                      - paragraph [ref=f187e135]:
                        - text: No, you do not need to include the Google Pay button on your own checkout surfaces to participate. You do need to
                        - link "create a Google Pay & Wallet Console account Opens in new window" [ref=f187e136] [cursor=pointer]:
                          - /url: https://pay.google.com/business/console
                        - text: . If your PSP is not integrated with the Google Pay API, the PSP can follow the steps
                        - link "here Opens in new window" [ref=f187e137] [cursor=pointer]:
                          - /url: https://developers.google.com/pay
                        - text: to onboard. If you require processing payments direct integration (without a PSP) you will also need to configure encryption and upload PCI compliance documentation. You can find guidance for this integration
                        - link "here Opens in new window" [ref=f187e138] [cursor=pointer]:
                          - /url: https://developers.google.com/pay/api/web/guides/resources/payment-data-cryptography
                        - text: .
                      - paragraph [ref=f187e139]:
                        - strong [ref=f187e140]: What changes do I need to make to my Merchant Center account?
                      - paragraph [ref=f187e141]:
                        - text: Merchant Center will continue to be the central hub to prepare your product data to show ads and listings on Google surfaces. The best preparation is to ensure all your data in the Merchant Center - from product feeds to brand assets - is as robust and up-to-date as possible.
                        - link "Review the guidelines for full UCP implementation guide Opens in new window" [ref=f187e142] [cursor=pointer]:
                          - /url: https://developers.google.com/merchant/ucp/guides/merchant-center
