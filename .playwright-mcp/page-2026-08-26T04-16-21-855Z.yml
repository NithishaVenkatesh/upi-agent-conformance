    - main [ref=f209e160]:
      - generic [ref=f209e161]:
        - navigation "Breadcrumbs" [ref=f209e163]:
          - list [ref=f209e164]:
            - listitem [ref=f209e165]:
              - link "Docs" [ref=f209e167] [cursor=pointer]:
                - /url: /docs
            - listitem [ref=f209e172]:
              - link "Overview" [ref=f209e174] [cursor=pointer]:
                - /url: /documentation/sharing
            - listitem [ref=f209e179]:
              - generic [ref=f209e180]: Meta Web Crawlers
        - article [ref=f209e183]:
          - heading "Meta Web Crawlers" [level=1] [ref=f209e184]
          - generic [ref=f209e185]: "Updated: May 21, 2026"
          - generic [ref=f209e189]:
            - button "Copy for LLM" [ref=f209e191] [cursor=pointer]
            - link "View as Markdown" [ref=f209e198] [cursor=pointer]:
              - /url: /documentation/sharing/webmasters/web-crawlers.md
          - generic [ref=f209e204]: Meta uses web crawlers (software which fetches content from websites or web apps) for a number of different purposes. This page lists the User Agent (UA) strings that identify Meta’s most common web crawlers and what each of those crawlers are used for.
          - generic [ref=f209e205]: We make it easy for site managers and content owners to indicate their preferences by using industry-standard practices like robots.txt rather than non-standard formats like NoAI tags. This page provides guidance on how to configure your robots.txt file so that our crawlers interact properly with your site.
          - generic [ref=f209e208]:
            - heading "FacebookExternalHit" [level=2] [ref=f209e209]
            - button [ref=f209e210] [cursor=pointer]
          - generic [ref=f209e214]:
            - text: The primary purpose of FacebookExternalHit is to crawl the content of an app or website that was shared on one of Meta’s family of apps, such as Facebook, Instagram, or Messenger. The link might have been shared by copying and pasting or by using the
            - link "Facebook social plugin" [ref=f209e215] [cursor=pointer]:
              - /url: /documentation/plugins
            - text: . This crawler gathers, caches, and displays information about the app or website such as its title, description, and thumbnail image.
          - generic [ref=f209e216]: "The specific UA string that you will see in your log files will be similar to one of the following:"
          - list [ref=f209e217]:
            - listitem [ref=f209e219]:
              - code [ref=f209e220]: facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)
            - listitem [ref=f209e222]:
              - code [ref=f209e223]: facebookexternalhit/1.1
          - generic [ref=f209e224]: Note that the FacebookExternalHit crawler might bypass robots.txt when performing security or integrity checks, such as checking for malware or malicious content.
          - generic [ref=f209e227]:
            - heading "Crawler Requirements" [level=3] [ref=f209e228]
            - button [ref=f209e229] [cursor=pointer]
          - list [ref=f209e233]:
            - listitem [ref=f209e235]:
              - text: Your server must use
              - strong [ref=f209e236]: gzip
              - text: and
              - strong [ref=f209e237]: deflate
              - text: encodings.
            - listitem [ref=f209e239]: Any Open Graph properties need to be listed before the first 1 MB of your website or app, or it will be cutoff.
            - listitem [ref=f209e241]: Ensure that the content can be crawled by the crawler within a few seconds or Facebook will be unable to display the content.
            - listitem [ref=f209e243]:
              - text: Your app or website should either generate and return a response with all required properties according to the bytes specified in the
              - code [ref=f209e244]: Range
              - text: header of the crawler request or it should ignore the
              - code [ref=f209e245]: Range
              - text: header altogether.
            - listitem [ref=f209e247]:
              - text: Add to your allow list either the
              - link "user agent strings or the IP addresses" [ref=f209e248] [cursor=pointer]:
                - /url: "#identify"
              - text: (more secure) used by the crawler.
          - generic [ref=f209e251]:
            - heading "Troubleshooting" [level=3] [ref=f209e252]
            - button [ref=f209e253] [cursor=pointer]
          - generic [ref=f209e257]:
            - text: If your app or website content is not available at the time of crawling, you can force a crawl once it becomes available either by passing the URL through the
            - link "Sharing Debugger tool" [ref=f209e258] [cursor=pointer]:
              - /url: /tools/debug
            - text: or by using the
            - link "Sharing API" [ref=f209e259] [cursor=pointer]:
              - /url: /docs/sharing/opengraph/using-objects#update
            - text: .
          - generic [ref=f209e260]: "You can simulate a crawler request with the following code:"
          - generic [ref=f209e261]:
            - code [ref=f209e263]: "curl -v --compressed -H \"Range: bytes=0-524288\" -H \"Connection: close\" -A \"facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)\" \"$URL\""
            - button [ref=f209e264] [cursor=pointer]
          - generic [ref=f209e269]:
            - heading "Meta-WebIndexer" [level=2] [ref=f209e270]
            - button [ref=f209e271] [cursor=pointer]
          - generic [ref=f209e275]: The Meta-WebIndexer crawler navigates the web to improve Meta AI search result quality for users. In doing so, Meta analyzes online content to enhance the relevance and accuracy of Meta AI. Allowing Meta-WebIndexer in your robots.txt file helps us cite and link to your content in Meta AI’s responses.
          - generic [ref=f209e276]: "The specific UA string that you will see in your log files will be similar to one of the following:"
          - list [ref=f209e277]:
            - listitem [ref=f209e279]:
              - code [ref=f209e280]: meta-webindexer/1.1 (+/documentation/sharing/webmasters/web-crawlers)
            - listitem [ref=f209e282]:
              - code [ref=f209e283]: meta-webindexer/1.1
          - generic [ref=f209e286]:
            - heading "Meta-ExternalAds" [level=2] [ref=f209e287]
            - button [ref=f209e288] [cursor=pointer]
          - generic [ref=f209e292]: The Meta-ExternalAds crawler crawls the web for use cases such as improving advertising and other business-related products and services.
          - generic [ref=f209e293]: "The specific UA string that you will see in your log files will be similar to one of the following:"
          - list [ref=f209e294]:
            - listitem [ref=f209e296]:
              - code [ref=f209e297]: meta-externalads/1.1 (+/documentation/sharing/webmasters/web-crawlers)
            - listitem [ref=f209e299]:
              - code [ref=f209e300]: meta-externalads/1.1
          - generic [ref=f209e303]:
            - heading "Meta-ExternalAgent" [level=2] [ref=f209e304]
            - button [ref=f209e305] [cursor=pointer]
          - generic [ref=f209e309]: The Meta-ExternalAgent crawler crawls the web for use cases such as training foundation AI models or improving products by indexing content directly.
          - generic [ref=f209e310]: "The specific UA string that you will see in your log files will be similar to one of the following:"
          - list [ref=f209e311]:
            - listitem [ref=f209e313]:
              - code [ref=f209e314]: meta-externalagent/1.1 (+/documentation/sharing/webmasters/web-crawlers)
            - listitem [ref=f209e316]:
              - code [ref=f209e317]: meta-externalagent/1.1
          - generic [ref=f209e320]:
            - heading "Meta-ExternalFetcher" [level=2] [ref=f209e321]
            - button [ref=f209e322] [cursor=pointer]
          - generic [ref=f209e326]: The Meta-ExternalFetcher crawler fetches individual links at a user’s request and supports product functions such as evaluating and improving agentic AI capabilities—including helping AI navigate websites to complete tasks for users. Accordingly, this crawler may bypass robots.txt rules.
          - generic [ref=f209e327]: "The specific UA string that you will see in your log files will be similar to one of the following:"
          - list [ref=f209e328]:
            - listitem [ref=f209e330]:
              - code [ref=f209e331]: meta-externalfetcher/1.1 (+/documentation/sharing/webmasters/web-crawlers)
            - listitem [ref=f209e333]:
              - code [ref=f209e334]: meta-externalfetcher/1.1
          - generic [ref=f209e337]:
            - heading "The robots.txt file" [level=2] [ref=f209e338]
            - button [ref=f209e339] [cursor=pointer]
          - generic [ref=f209e343]: By configuring the robots.txt file on your website, you can specify to the Meta web crawlers how you would prefer them to interact with your site. In order to block these crawlers, add a disallow for the relevant crawler to robots.txt. The Meta-ExternalFetcher crawler may bypass robots.txt because it performs fetches that were requested by the user. Also, the FacebookExternalHit crawler might bypass robots.txt when performing security or integrity checks.
          - generic [ref=f209e344]:
            - code [ref=f209e346]: "User-agent: meta-externalagent Allow: / # Allow everything Disallow: /private/ # Disallow a specific directory"
            - button [ref=f209e347] [cursor=pointer]
          - generic [ref=f209e350]:
            - text: Please allow up to 24 hours for changes to
            - code [ref=f209e351]: robots.txt
            - text: to take effect because crawlers may cache the contents of
            - code [ref=f209e352]: robots.txt
            - text: for up to 24 hours.
          - generic [ref=f209e355]:
            - heading "Contact us" [level=2] [ref=f209e356]
            - button [ref=f209e357] [cursor=pointer]
          - generic [ref=f209e361]:
            - text: If you have questions or concerns, please contact us at
            - link "webmasters@meta.com" [ref=f209e362] [cursor=pointer]:
              - /url: mailto:webmasters@meta.com
            - text: (Meta Web Masters).
