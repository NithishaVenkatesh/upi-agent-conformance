            - paragraph [ref=f197e61]:
              - text: Last week, builders from across AI, agents, Web3, DeFi, and commerce came together for the
              - link [ref=f197e62] [cursor=pointer]:
                - /url: https://dorahacks.io/hackathon/x402/detail
                - strong [ref=f197e63]: San Francisco Agentic Commerce x402 Hackathon
              - text: . A hybrid, 3-day build sprint designed to push “agentic commerce” forward with agents that can act as real buyers and sellers.
            - strong [ref=f197e65]: Event snapshot
            - paragraph [ref=f197e66]: With build tracks from partners Coinbase, Google, and Virtuals, the SKALE-led hybrid hackathon (SF hub + global online participation) had over $50,000 in prizes to giveaway to some of the best hackers in the space. Emphasis was placed on shipping real demos that integrate x402 into an actual payment/commercial flow and projects were judged on partner integration (track-dependent), agentic depth, commerce realism, and polish/ship-ability.
            - strong [ref=f197e68]: By the numbers
            - list [ref=f197e69]:
              - listitem [ref=f197e70]: 324 hackers registered
              - listitem [ref=f197e71]: 86 builds submitted
              - listitem [ref=f197e72]: 275k+ onchain transactions
            - strong [ref=f197e74]: Winners
            - strong [ref=f197e76]: "Overall Track: Best Agentic App / Agent"
            - paragraph [ref=f197e77]:
              - strong [ref=f197e78]:
                - text: "1st Place:"
                - link "World of Geneva" [ref=f197e79] [cursor=pointer]:
                  - /url: http://dorahacks.io/buidl/39336
              - text: "- A next-generation MMORPG where AI agents autonomously play the game while human players observe as agents complete quests, fight mobs, trade items, and progress through a multi-zone world."
            - paragraph [ref=f197e80]:
