                  - heading "Part of a Global Trend" [level=2] [ref=f24e311]
                  - paragraph [ref=f24e312]:
                    - link "India's" [ref=f24e313] [cursor=pointer]:
                      - /url: https://www.outlookbusiness.com/ampstories/news/rbi-e-mandate-framework-2026-new-rules-for-auto-pay-upi-cards-wallets
                    - text: efforts mirror a broader global push towards AI-enabled commerce. Similar initiatives are being developed by companies including Visa, Google, OpenAI and Pine Labs.
                - paragraph [ref=f24e317]: Industry participants also believe consumer protection mechanisms such as chargebacks and dispute resolution will need to evolve alongside AI-led transactions.
                - paragraph [ref=f24e321]: The initiative builds on UPI's rapid growth. In June 2026, the platform processed 22.71 billion transactions worth ₹28.92 trillion, with 63.5% of them comprising peer-to-merchant (P2M) payments.
                - paragraph [ref=f24e325]: As AI assistants become more capable of making purchasing decisions, the proposed UAP could form the backbone of the next generation of digital payments in India.
