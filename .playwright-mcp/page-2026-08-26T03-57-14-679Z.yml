            - generic [ref=f24e213]: India Plans AI-Powered UPI Payments Framework Through Unified Agent Protocol
            - generic [ref=f24e216]:
              - generic [ref=f24e217]:
                - generic [ref=f24e220]:
                  - generic [ref=f24e222]:
                    - img "Summary" [ref=f24e223]
                    - generic [ref=f24e224]: Summary of this article
                  - list [ref=f24e226]:
                    - listitem [ref=f24e227]:
                      - paragraph [ref=f24e228]: NPCI is reportedly developing the Unified Agent Protocol (UAP) to enable AI agents to make UPI transactions on behalf of users without altering the existing payments infrastructure.
                    - listitem [ref=f24e229]:
                      - paragraph [ref=f24e230]: The framework will authenticate and authorise AI agents, define transaction permissions and preserve UPI's interoperability as agentic commerce gains traction.
                    - listitem [ref=f24e231]:
                      - paragraph [ref=f24e232]: India's initiative comes as companies including Visa, Google and OpenAI develop similar protocols for AI-enabled commerce, with everyday purchases expected to be among the first automated use cases.
                - paragraph [ref=f24e236]:
                  - text: India is developing a new digital payments framework that would allow artificial intelligence (AI) agents to make transactions on behalf of users through the Unified Payments Interface (UPI), according to a report by
                  - emphasis [ref=f24e237]: Business Standard
                  - text: .
                - paragraph [ref=f24e241]: The proposed Unified Agent Protocol (UAP) is being developed by the National Payments Corporation of India (NPCI) in consultation with industry stakeholders. If rolled out, it could position India among the first countries to create national infrastructure for AI-led, or "agentic", payments.
                - generic [ref=f24e243]:
                  - link [ref=f24e245] [cursor=pointer]:
                    - /url: https://www.amazon.in/dp/B0HCBLZYSR
                    - img "The Family Office Playbook" [ref=f24e246]
                  - generic [ref=f24e247]:
                    - generic [ref=f24e248]:
                      - paragraph [ref=f24e249]: 1 August 2026
                      - paragraph [ref=f24e250]: Get the latest issue of Outlook Business
                    - link [ref=f24e252] [cursor=pointer]:
                      - /url: https://www.amazon.in/dp/B0HCBLZYSR
                      - img "amazon" [ref=f24e253]
                - generic [ref=f24e256]:
                  - heading "What Is the Unified Agent Protocol?" [level=2] [ref=f24e257]
                  - paragraph [ref=f24e258]:
                    - text: The UAP aims to create a common, interoperable framework that enables AI agents to be registered, verified and authorised to transact across the
                    - link "UPI" [ref=f24e259] [cursor=pointer]:
                      - /url: https://www.outlookbusiness.com/news/upi-transactions-ease-from-record-high-to-289-lakh-cr-in-june
                    - text: ecosystem without changing the underlying payment rails.
                - paragraph [ref=f24e263]: While UPI's existing trust architecture is designed around human users and their devices, the rise of AI agents capable of shopping, booking services and making purchases independently requires a new layer of authentication.
                - heading "Advertisement" [level=3] [ref=f24e265]
                - paragraph [ref=f24e270]: The protocol would verify whether an AI agent is authorised to act on behalf of a user, define the limits of that authority and establish accountability.
                - paragraph [ref=f24e274]: According to the report, NPCI's role would remain limited to validating whether a payment request is genuine, similar to the current UPI system, without visibility into what is being purchased.
                - generic [ref=f24e277]:
                  - heading "Everyday Purchases Could Lead Adoption" [level=2] [ref=f24e278]
                  - paragraph [ref=f24e279]:
                    - text: AI agents could originate from merchant apps,
                    - link "payment platforms" [ref=f24e280] [cursor=pointer]:
                      - /url: https://www.outlookbusiness.com/news/india-launches-upi-in-greece
                    - text: ", AI assistants such as ChatGPT and Claude, or dedicated agentic platforms."
                - paragraph [ref=f24e284]:
                  - text: A senior executive at a digital payments company told
                  - emphasis [ref=f24e285]: Business Standard
                  - text: that low-value, repetitive purchases—such as groceries, dairy products and other daily essentials—are likely to be the first use cases for agentic payments. This could create new opportunities for quick-commerce platforms.
                - heading "Advertisement" [level=3] [ref=f24e287]
                - paragraph [ref=f24e292]: The protocol is also intended to preserve interoperability across the UPI ecosystem, allowing AI-powered transactions to scale without requiring separate trust arrangements between banks, merchants and technology providers.
