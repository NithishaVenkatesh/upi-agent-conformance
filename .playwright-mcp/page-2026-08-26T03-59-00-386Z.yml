                  - paragraph [ref=f74e138]: Digital Payments – E-mandate Framework, 2026
                  - paragraph [ref=f74e139]: In exercise of the powers conferred by Sections 10(2) read with Section 18 of the Payment and Settlement Systems (PSS) Act, 2007, the Reserve Bank of India (RBI), being satisfied that it is necessary and expedient in the public interest so to do, hereby consolidates all circulars pertaining to e-mandates and issues the Directions hereinafter specified.
                  - paragraph [ref=f74e140]: 1. Short Title and Commencement
                  - paragraph [ref=f74e141]: (a) These Directions shall be called the “Digital Payments - E-mandate Framework, 2026”.
                  - paragraph [ref=f74e142]: (b) These Directions shall be effective immediately.
                  - paragraph [ref=f74e143]: 2. Applicability
                  - paragraph [ref=f74e144]: The provisions of these Directions shall be applicable to all Payment System Providers and Payment System Participants in respect of processing of recurring transactions, domestic or cross-border, using cards / PPI / UPI.
                  - paragraph [ref=f74e145]: 3. Definitions
                  - paragraph [ref=f74e146]:
                    - text: (a) The terms ‘authentication’, ’factor of authentication’, ‘issuer’, ‘merchant’ will have the same meaning as defined in
                    - link "Reserve Bank of India (Authentication mechanisms for digital payment transactions) Directions, 2025 dated September 25, 2025" [ref=f74e147] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=12898&Mode=0
                    - text: and
                    - link "Master Direction on Regulation of Payment Aggregator (PA) dated September 15, 2025" [ref=f74e148] [cursor=pointer]:
                      - /url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=12896
                    - text: .
                  - paragraph [ref=f74e149]: 4. Registration and revocation of E-Mandate
                  - paragraph [ref=f74e150]: (a) A customer desirous of opting for e-mandate facility shall undertake a one-time registration process. The mandate shall be registered only after successful validation of additional factor of authentication (AFA), in addition to the normal process required by the issuer.
                  - paragraph [ref=f74e151]: (b) Every e-mandate registered by the issuer shall specify the validity period of the e-mandate. The issuer shall provide the customer with a facility to modify the validity period or withdraw the e-mandate at any point of time. Information about this facility shall be clearly communicated to the customer at the time of registration.
                  - paragraph [ref=f74e152]: (c) The e-mandate may be for either a pre-specified fixed amount or for a variable amount subject to the overall cap fixed by the RBI. In the case of variable e-mandates, the issuer shall provide the customer with a facility to specify the maximum value of any recurring transaction.
                  - paragraph [ref=f74e153]: (d) The customer shall be given a facility to choose or change a mode among available options (SMS, email, etc.) for receiving the pre-transaction notification from the issuer.
                  - paragraph [ref=f74e154]: (e) Any modification in, or withdrawal of, an existing e-mandate shall require AFA validation by the issuer.
                  - paragraph [ref=f74e155]: 5. Processing of first transaction and subsequent recurring transactions
                  - paragraph [ref=f74e156]: (a) The first transaction under an e-mandate shall require AFA validation. If the first transaction is processed along with registration of the e-mandate, then AFA validation may be combined.
                  - paragraph [ref=f74e157]: (b) Payments under e-mandates shall not be subject to any other limits / controls set by the customer.
                  - paragraph [ref=f74e158]: 6. Pre-transaction Notification
                  - paragraph [ref=f74e159]: (a) An issuer shall send a pre-transaction notification to the customer, at least 24 hours prior to the actual charge / debit.
                  - paragraph [ref=f74e160]: (b) The pre-transaction notification shall, at the minimum, inform the customer about the merchant’s name, transaction amount, date / time of debit, reference number of e-mandate, reason for debit, i.e., e-mandate registered by the customer.
                  - paragraph [ref=f74e161]: (c) The issuer shall provider a customer with a facility to opt-out of any particular transaction or the e-mandate. Any such opt-out shall be validated by the issuer using AFA. An intimation to this effect shall be sent to the customer.
                  - paragraph [ref=f74e162]: (d) Pre-transaction notification is not required for e-mandates registered to auto-replenish balances of FASTag, and National Common Mobility Card (NCMC).
                  - paragraph [ref=f74e163]: 7. Post-transaction notification
                  - paragraph [ref=f74e164]:
                    - text: An issuer shall send a post-transaction notification to the customer. This notification shall, at the minimum, inform the customer about the merchant’s name, transaction amount, date and time of debit, reference number of transaction and e-mandate, reason for debit, i.e., e-mandate registered by the customer, and details on grievance redressal
                    - superscript [ref=f74e165]:
                      - link "1" [ref=f74e166] [cursor=pointer]:
                        - /url: "#F1"
                    - text: .
                  - paragraph [ref=f74e167]: 8. Transaction limits and velocity check
                  - paragraph [ref=f74e168]: (a) All recurring transactions may be authorised without AFA up to ₹15,000/- per transaction. Transactions above this amount shall be subject to AFA.
                  - paragraph [ref=f74e169]: (b) Payment of insurance premiums, subscription to mutual funds, and credit card bill payments may be made without AFA up to ₹1,00,000/- per transaction.
                  - paragraph [ref=f74e170]: 9. Dispute resolution and grievance redressal
                  - paragraph [ref=f74e171]: (a) An appropriate dispute redressal system shall be put in place by the issuer to facilitate the customer to lodge grievance/s.
                  - paragraph [ref=f74e172]: (b) RBI instructions on limiting liability of customers for unauthorised transactions shall be applicable to recurring transactions under e-mandates as well.
                  - paragraph [ref=f74e173]: 10. Other provisions
                  - paragraph [ref=f74e174]: (a) No charges shall be levied to the customer for availing the e-mandate facility for recurring transactions.
                  - paragraph [ref=f74e175]:
                    - text: (b) In case of cards, existing e-mandate(s) can be mapped to reissued cards
                    - superscript [ref=f74e176]:
                      - link "2" [ref=f74e177] [cursor=pointer]:
                        - /url: "#F2"
                    - text: .
                  - paragraph [ref=f74e178]: (c) An acquirer shall ensure compliance with these directions by merchants on-boarded by them.
                  - paragraph [ref=f74e179]: 11. Repeal
                  - paragraph [ref=f74e180]: With the issue of these directions, the instructions/guidelines contained in the following circulars, issued by the Reserve Bank stand repealed.
                  - text: No Circular No. Date Subject 1.
