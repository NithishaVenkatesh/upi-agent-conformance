        - generic [ref=f769e61]:
          - generic [ref=f769e62]:
            - heading "What is UPI Circle" [level=2] [ref=f769e63]
            - iframe [ref=f769e66]
          - generic [ref=f769e67]:
            - heading "Features of UPI Circle" [level=2] [ref=f769e68]
            - iframe [ref=f769e71]
        - generic [ref=f769e74]:
          - paragraph [ref=f769e75]:
            - strong [ref=f769e76]: Product Overview
            - text: UPI Circle is a solution where a payer can extend the authorization to transact from their UPI account to an individual with required limits. It enables a secondary user to perform transactions from the payer’s account with minimum intervention and with adequate risk mitigations.
            - strong [ref=f769e77]: Primary User
            - text: "- An UPI user who is delegating the UPI authentication to make payment to a secondary user"
            - strong [ref=f769e78]: Secondary User
            - text: "- An UPI user who will be performing UPI payments with appropriate authorization of the primary user. A secondary user is an individual with or without having a bank account linked on UPI."
            - strong [ref=f769e79]: Insight Behind the feature
            - text: In the current payment ecosystem, cash as a payment instrument is still being used predominantly. UPI has created a seamless digital experience to enable users to transact via their mobile devices, however there is still the pre-requisite for a user to have a bank account to transact through UPI. Currently users are still dependent on cash for their daily payment needs because they do not manage their own money through their own account. Also, control resides with primary user to make UPI transactions on behalf of their secondary users because they have a bank account and manage finances of a household. About 6% of UPI users make large number of transactions mainly because they also make transactions on behalf of others. This feature will allow primary user to have the same control while offering more convenience while making delegated payments. A payment solution for these types of users who do not use UPI due to lack of enablement or wariness of digital payments is now solutioned with UPI Circle feature.
            - strong [ref=f769e80]: UPI Payment through IoT (Internet of Things)
            - text: "UPI Payment through IoT (Internet of Things) refers to the payments that user can delegate to IoT (smart devices and Software). Users can now use devices other than Smart Phone to make UPI transactions. This new feature improves convenience for users by reducing the number of friction points. For e.g., User can make payments directly through their trusted devices or software such as A. Retail purchases through Smart Glasses B. Payment of Streaming Services through Smart TV C. Fuelling/EV recharge through Connected Cars D. buy groceries/goods from AI chatbots, etc. Note: Currently AI/Software driven IoT Payments are under pilot with limited users as a part of Closed User Group."
            - strong [ref=f769e81]: Transaction Limits
          - list [ref=f769e82]:
            - listitem [ref=f769e83]: ₹5,000 per transaction per device
            - listitem [ref=f769e84]: ₹15,000 monthly limit per device
            - listitem [ref=f769e85]: ₹2,000 limit for the first 24 hours after linking a new device
            - listitem [ref=f769e86]: Maximum of 5 secondary devices/ software (IoT) can be linked
          - paragraph [ref=f769e87]:
            - strong [ref=f769e88]: Transaction Process Flow
          - list [ref=f769e89]:
            - listitem [ref=f769e90]: Open IoT App to start registration for UPI payment.
            - listitem [ref=f769e91]: Select "Enable UPI for your device” option and enter mobile number.
            - listitem [ref=f769e92]: Please ensure the mobile number entered is same that is being used in Primary UPI App presently.
            - listitem [ref=f769e93]: Enter OTP received on your mobile phone and confirm to proceed.
            - listitem [ref=f769e94]: QR code is displayed on the screen of the IoT device app. In case of in-phone app based journeys, intent shall be used.
            - listitem [ref=f769e95]: QR/intent linking based journey will be completed on the primary UPI App wherein the device/software details shall be shown.
            - listitem [ref=f769e96]: Provide consent along with required ‘Limit’ for the IoT device and authenticate with UPI PIN or biometrics.
            - listitem [ref=f769e97]: User can now initiate payment when needed from linked devices or software.
          - paragraph [ref=f769e98]:
            - strong [ref=f769e99]: Possible User Stories
            - strong [ref=f769e100]: Parent providing expenses to his college kid…
            - text: As a Parent of a junior college going student who might need to spend money on stationary, travel, food etc. I want to give my child the ability to spend money using cash-free methods, but I also want to monitor my child’s expenses so that I’m assured that my child is spending only on the required things and not anywhere else and without risk of holding the cash.
            - strong [ref=f769e101]: Senior citizen who is wary of digital payments…
            - text: As a senior citizen who goes out to buy daily necessities, I’m unsure to carry out online transactions on my own. I want my children to pay and enter the necessary details to proceed with the transaction so that I can shop freely and don’t have to go through the stress of online payment wherever I go.
            - strong [ref=f769e102]: Busy individual who wants to delegate household expenses…
            - text: As a corporate employee, whose spouse is also working 9-5, but we don’t have enough time and energy left after work to buy household items on our own. I want my maid to do the shopping and pay on my behalf but within an authorization limit, so that I can get all the necessary items fresh and on time while also managing my budget and not having to monitor each small transaction.
            - strong [ref=f769e103]: Business Owner who doesn’t want to give petty cash to their staff…
            - text: As a car rental service owner, where passenger transfers the one-time rental amount to my account, I want the drivers to do car petrol payments and pay for their own expenses online while on work so that it reduces the burden to handle the cash, and it is easier for me to control usage and track payments.
