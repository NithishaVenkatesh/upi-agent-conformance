            - heading "UPI Reserve Pay" [level=1] [ref=f792e213]
            - paragraph [ref=f792e214]: Block customer funds upfront, debit as you deliver value. Boost conversion rates, reduce payment failures and enhance customer experience with UPI Reserve Pay.
            - generic [ref=f792e215]:
              - button [ref=f792e216] [cursor=pointer]:
                - generic "Copy as Markdown for ChatGPT, Claude or Gemini" [ref=f792e217]: Copy for AI
              - button [ref=f792e222] [cursor=pointer]:
                - generic "Open this page as plain Markdown in a new tab" [ref=f792e223]: View as Markdown
            - separator [ref=f792e226]
          - main [ref=f792e227]:
            - paragraph [ref=f792e228]: UPI Reserve Pay with Single Block Multi Debit (SBMD) enables businesses to block customer funds upfront and debit automatically as products or services are delivered. This payment method eliminates common issues with traditional online transactions where payment timing does not align with service delivery.
            - list [ref=f792e229]:
              - listitem [ref=f792e230]: Instead of customers paying the full amount upfront for uncertain outcomes or businesses delivering services before guaranteed payment collection, Reserve Pay allows customers to authorise a spending limit once.
              - listitem [ref=f792e231]: Businesses can then debit exact amounts automatically as they fulfil orders, complete services or deliver products — without requiring additional customer authentication.
            - generic [ref=f792e232]:
              - heading [level=2] [ref=f792e233]:
                - link [ref=f792e235] [cursor=pointer]:
                  - /url: /docs/payments/recurring-payments/upi-reserve-pay/#how-reserve-pay-works
                  - paragraph [ref=f792e236]: How Reserve Pay Works
              - paragraph [ref=f792e237]: "Reserve Pay enables businesses to collect payments seamlessly through a simple four-step process:"
              - list [ref=f792e238]:
                - listitem [ref=f792e239]:
                  - strong [ref=f792e240]: Customer Reserves Funds
                  - text: ": Customers block estimated spending amount in their account via UPI PIN authorisation."
                - listitem [ref=f792e241]:
                  - strong [ref=f792e242]: Deliver Your Service
                  - text: ": Provide products, complete rides, deliver food or render services as usual."
                - listitem [ref=f792e243]:
                  - strong [ref=f792e244]: Automatic Payment Collection
                  - text: ": Debit exact amounts instantly from the pre-approved limit set by the customer."
                - listitem [ref=f792e245]:
                  - strong [ref=f792e246]: Guaranteed Settlement
                  - text: ": Receive funds in your account with industry-leading success rates and faster reconciliation."
            - generic [ref=f792e247]:
              - heading [level=2] [ref=f792e248]:
                - link [ref=f792e250] [cursor=pointer]:
