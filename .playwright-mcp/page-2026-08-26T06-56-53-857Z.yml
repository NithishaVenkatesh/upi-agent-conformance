        - main [ref=f818e417]:
          - generic [ref=f818e419]:
            - generic [ref=f818e420]:
              - generic [ref=f818e421]:
                - generic [ref=f818e422]: UPI Reserve Pay
                - generic [ref=f818e423]:
                  - heading "Overview" [level=1] [ref=f818e424]
                  - generic [ref=f818e425]:
                    - button "Open in ChatGPT" [ref=f818e426] [cursor=pointer]
                    - button "More actions" [ref=f818e431] [cursor=pointer]
              - paragraph [ref=f818e435]: Use Cashfree UPI Reserve Pay to block funds on a customer’s UPI account once and debit automatically as products or services are delivered over time, securely.
            - generic [ref=f818e436]:
              - generic [ref=f818e437]: UPI Reserve Pay is a payment framework that enables you to block customer funds upfront and debit automatically as products or services are delivered. It combines the security of One-Time Mandates (OTM) with the flexibility of multiple debits, ensuring high payment success rates and enhanced customer experience.
              - generic [ref=f818e438]: "Reserve Pay supports the following payment modes:"
              - list [ref=f818e439]:
                - listitem [ref=f818e440]: Savings Account (UPI-linked)
                - listitem [ref=f818e441]: Credit Line on UPI
                - listitem [ref=f818e442]: RuPay Credit Card on UPI
              - heading "Navigate to header Key features" [level=2] [ref=f818e443]:
                - link "Navigate to header" [ref=f818e444] [cursor=pointer]:
                  - /url: "#key-features"
                - generic [ref=f818e449] [cursor=pointer]: Key features
              - generic [ref=f818e450]: "UPI Reserve Pay provides the following capabilities:"
              - list [ref=f818e451]:
                - listitem [ref=f818e452]:
                  - strong [ref=f818e453]: Single block, multiple debits
                  - text: ": Block a maximum amount once and debit multiple times against the blocked amount."
                - listitem [ref=f818e454]:
                  - strong [ref=f818e455]: Guaranteed funds
                  - text: ": Pre-blocked funds ensure payment collection without dependency on the customer’s future account balance."
                - listitem [ref=f818e456]:
                  - strong [ref=f818e457]: Flexible payment collection
                  - text: ": Debit exact amounts as services or products are delivered."
                - listitem [ref=f818e458]:
                  - strong [ref=f818e459]: Automatic release
                  - text: ": Any unused funds are automatically released after mandate expiry or when you manually release them."
                - listitem [ref=f818e460]:
                  - strong [ref=f818e461]: Webhook notifications
                  - text: ": Receive real-time updates for authorisations, payments, and refunds."
              - heading "Navigate to header Benefits" [level=2] [ref=f818e462]:
                - link "Navigate to header" [ref=f818e463] [cursor=pointer]:
                  - /url: "#benefits"
                - generic [ref=f818e468] [cursor=pointer]: Benefits
              - generic [ref=f818e469]: "The following table describes the benefits of UPI Reserve Pay for merchants and customers:"
              - region "Scrollable table" [ref=f818e470]:
                - table [ref=f818e472]:
                  - rowgroup [ref=f818e473]:
                    - row [ref=f818e474]:
                      - columnheader "Merchant benefits" [ref=f818e475]
                      - columnheader "Customer benefits" [ref=f818e476]
                  - rowgroup [ref=f818e477]:
                    - row [ref=f818e478]:
                      - cell "Reduce cart abandonment by minimising friction at checkout—customers don’t need to authenticate with a PIN for repeat payments." [ref=f818e479]
                      - cell "Customers can keep money in their bank account earning interest instead of preloading wallets, or block funds via UPI credit card to avoid actual fund blocking." [ref=f818e480]
                    - row [ref=f818e481]:
                      - cell "Achieve high payment success rates and minimise failed payments (typically 10% of transactions)." [ref=f818e482]
                      - cell "Customers can authorise once and pay flexibly without multiple authentication steps for recurring payments." [ref=f818e483]
                    - row [ref=f818e484]:
                      - cell "Guarantee payment collection irrespective of the customer’s future account balance." [ref=f818e485]
                      - cell "Customers can manage funds better by blocking specific limits with each merchant (for example, ₹10,000 on a food delivery app)." [ref=f818e486]
                    - row [ref=f818e487]:
                      - cell [ref=f818e488]:
                        - text: Enable flexible business models such as
                        - strong [ref=f818e489]: try and buy
                        - text: ", flexible reservations, subscriptions, and usage-based billing."
                      - cell "Customers can enjoy flexible payment options across multiple use cases without the need to preload funds." [ref=f818e490]
              - heading "Navigate to header Use cases" [level=2] [ref=f818e491]:
                - link "Navigate to header" [ref=f818e492] [cursor=pointer]:
                  - /url: "#use-cases"
                - generic [ref=f818e497] [cursor=pointer]: Use cases
              - generic [ref=f818e498]: "The following table describes common scenarios where UPI Reserve Pay adds value:"
              - region "Scrollable table" [ref=f818e499]:
                - table [ref=f818e501]:
                  - rowgroup [ref=f818e502]:
                    - row [ref=f818e503]:
                      - columnheader "Use case" [ref=f818e504]
                      - columnheader "Description" [ref=f818e505]
                  - rowgroup [ref=f818e506]:
                    - row [ref=f818e507]:
                      - cell "E-commerce “try and buy” or pay-on-delivery" [ref=f818e508]
                      - cell "Customers place an order and block funds (for example, ₹5,000) at checkout. When the product is delivered and confirmed, you debit only for the items the customer keeps. If the product is returned, the blocked funds are automatically released. This makes “try and buy” or “pay-on-delivery” safe for both you and your customers." [ref=f818e509]
                    - row [ref=f818e510]:
                      - cell "In-app wallets (without preloading)" [ref=f818e511]
                      - cell "Create instant wallets by asking customers to block a certain amount (for example, ₹2,000) in their bank account. Each time the customer purchases within the app, the amount is debited from the block. Unlike traditional wallets, customers don’t need to preload funds, and unused blocked funds are released automatically." [ref=f818e512]
                    - row [ref=f818e513]:
                      - cell "Smart margin trading and securities" [ref=f818e514]
                      - cell "Investors block a lump-sum amount (for example, ₹5,00,000) once in their account. Brokers can then debit smaller amounts as trades are executed or as shares are allotted. Investors don’t need to make multiple payments, and any unused funds remain in their account until the mandate expires." [ref=f818e515]
                    - row [ref=f818e516]:
                      - cell "Hotel and travel bookings" [ref=f818e517]
                      - cell "At the time of booking, customers block the estimated booking amount (for example, ₹10,000). The hotel or travel provider debits only the final bill at checkout or usage. If the customer cancels within the cancellation policy, the funds are automatically released." [ref=f818e518]
              - heading "Navigate to header How it works" [level=2] [ref=f818e519]:
                - link "Navigate to header" [ref=f818e520] [cursor=pointer]:
                  - /url: "#how-it-works"
                - generic [ref=f818e525] [cursor=pointer]: How it works
              - generic [ref=f818e526]: UPI Reserve Pay follows a workflow where customers reserve funds once, and you can debit multiple times against the reserved amount.
              - heading "Navigate to header Customer and merchant workflow" [level=3] [ref=f818e527]:
                - link "Navigate to header" [ref=f818e528] [cursor=pointer]:
                  - /url: "#customer-and-merchant-workflow"
                - generic [ref=f818e533] [cursor=pointer]: Customer and merchant workflow
              - generic [ref=f818e534]: "The following describes the end-to-end flow:"
              - list [ref=f818e535]:
                - listitem [ref=f818e536]:
                  - generic [ref=f818e537]:
                    - strong [ref=f818e538]: Customer reserves funds
                    - text: ": The customer authorises a total estimated amount via UPI PIN or pre-authorisation. For example, a customer reserves ₹10,000 for multiple purchases."
                - listitem [ref=f818e539]:
                  - generic [ref=f818e540]:
                    - strong [ref=f818e541]: You initiate multiple debits
                    - text: ": You debit portions of the reserved amount for each product or service delivered:"
                  - list [ref=f818e542]:
                    - listitem [ref=f818e543]: ₹3,000 for Product 1
                    - listitem [ref=f818e544]: ₹3,500 for Product 2
                    - listitem [ref=f818e545]: ₹3,500 for Product or Service 3
                - listitem [ref=f818e546]:
                  - generic [ref=f818e547]:
                    - strong [ref=f818e548]: No additional customer action
                    - text: ": The customer doesn’t need to enter a UPI PIN again for each debit. Reserved funds automatically cover each transaction up to the pre-approved limit."
                - listitem [ref=f818e549]:
                  - generic [ref=f818e550]:
                    - strong [ref=f818e551]: Guaranteed settlement
                    - text: ": You receive funds instantly or at a guaranteed settlement schedule. The remaining reserved balance reduces automatically after each debit."
              - heading "Navigate to header Common scenarios" [level=3] [ref=f818e552]:
                - link "Navigate to header" [ref=f818e553] [cursor=pointer]:
                  - /url: "#common-scenarios"
                - generic [ref=f818e558] [cursor=pointer]: Common scenarios
              - generic [ref=f818e559]: "UPI Reserve Pay is particularly useful for the following business models:"
              - list [ref=f818e560]:
                - listitem [ref=f818e561]:
                  - strong [ref=f818e562]: Subscription services
                  - text: ": Weekly or monthly deliveries"
                - listitem [ref=f818e563]:
                  - strong [ref=f818e564]: Instalment payments
                  - text: ": Partial payments for multiple products"
                - listitem [ref=f818e565]:
                  - strong [ref=f818e566]: Pay-as-you-go models
                  - text: ": Pre-reserved credit for multiple services like rides, utilities, or rentals"
              - heading "Navigate to header Integration workflow" [level=3] [ref=f818e567]:
                - link "Navigate to header" [ref=f818e568] [cursor=pointer]:
                  - /url: "#integration-workflow"
                - generic [ref=f818e573] [cursor=pointer]: Integration workflow
              - generic [ref=f818e574]: "The following table outlines the steps you need to follow to integrate UPI Reserve Pay:"
              - list [ref=f818e575]:
                - listitem [ref=f818e576]:
                  - generic [ref=f818e578]: "1"
                  - generic [ref=f818e581]:
                    - paragraph [ref=f818e582]: Create Subscription (Mandate Setup)
                    - generic [ref=f818e583]:
                      - generic [ref=f818e584]: Initialise the subscription by passing the required customer and plan details through the Create Subscription API.
                      - generic [ref=f818e585]:
                        - text: Once successfully created, the subscription enters the
                        - code [ref=f818e586]: INITIALIZED
                        - text: state, indicating that mandate setup has begun but customer approval is pending.
                - listitem [ref=f818e587]:
                  - generic [ref=f818e589]: "2"
                  - generic [ref=f818e592]:
                    - paragraph [ref=f818e593]: Raise Authorisation (Customer Approval)
                    - generic [ref=f818e594]:
                      - generic [ref=f818e595]: Trigger the authorisation request to block the mandate amount. The customer approves the blocked amount via UPI.
                      - list [ref=f818e596]:
                        - listitem [ref=f818e597]:
                          - text: On successful authorisation, the subscription transitions to the
                          - code [ref=f818e598]: ACTIVE
                          - text: state.
                        - listitem [ref=f818e599]:
                          - text: The
                          - code [ref=f818e600]: SUBSCRIPTION_AUTH_STATUS
                          - text: webhook is triggered to notify you of the authorisation outcome.
                - listitem [ref=f818e601]:
                  - generic [ref=f818e603]: "3"
                  - generic [ref=f818e606]:
                    - paragraph [ref=f818e607]: Raise Charge (Debit Funds)
                    - generic [ref=f818e608]:
                      - generic [ref=f818e609]: Initiate a charge against the blocked funds (either full or partial amount).
                      - list [ref=f818e610]:
                        - listitem [ref=f818e611]:
                          - text: On success, the
                          - code [ref=f818e612]: SUBSCRIPTION_PAYMENT_SUCCESS
                          - text: webhook is triggered.
                        - listitem [ref=f818e613]:
                          - text: On failure, the
                          - code [ref=f818e614]: SUBSCRIPTION_PAYMENT_FAILED
                          - text: webhook is triggered.
                - listitem [ref=f818e615]:
                  - generic [ref=f818e617]: "4"
                  - generic [ref=f818e620]:
                    - paragraph [ref=f818e621]: Get Mandate Details
                    - generic [ref=f818e622]:
                      - generic [ref=f818e623]: "Use the Get Mandate Details API to retrieve:"
                      - list [ref=f818e624]:
                        - listitem [ref=f818e625]: All charges raised against the mandate
                        - listitem [ref=f818e626]: Remaining blocked amount
                        - listitem [ref=f818e627]: Current mandate limits and status
                - listitem [ref=f818e628]:
                  - generic [ref=f818e630]: "5"
                  - generic [ref=f818e633]:
                    - paragraph [ref=f818e634]: Refund Individual Charge
                    - generic [ref=f818e635]:
                      - generic [ref=f818e636]: Refund a specific charge using the Subscription Refund API.
                      - list [ref=f818e637]:
                        - listitem [ref=f818e638]:
                          - text: Refund updates are communicated via the
                          - code [ref=f818e639]: SUBSCRIPTION_REFUND_STATUS
                          - text: webhook.
                - listitem [ref=f818e640]:
                  - generic [ref=f818e642]: "6"
                  - generic [ref=f818e645]:
                    - paragraph [ref=f818e646]: Manage Mandate
                    - generic [ref=f818e647]:
                      - generic [ref=f818e648]: "Use the Manage Mandate API to:"
                      - list [ref=f818e649]:
