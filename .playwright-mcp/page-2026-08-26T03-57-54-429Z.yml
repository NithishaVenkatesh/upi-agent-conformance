        - generic [ref=f61e57]:
          - paragraph [ref=f61e58]: At the India AI Impact Summit in New Delhi on February 20, 2026, Razorpay and the National Payments Corporation of India (NPCI) officially announced a partnership to bring Agentic Payments to Claude. Currently in a pilot phase with a select group of users, this platform makes it possible to shop with AI, allowing people to order food, groceries, and everyday essentials from Zomato, Swiggy, and Zepto—all without ever leaving the conversation. By integrating secure payments directly into the agentic experience, Claude can now complete transactions on a user’s behalf, ensuring that the entire shopping journey remains seamless and within the flow of the chat.
          - paragraph [ref=f61e59]: India has quickly become one of the largest AI-native markets in the world. Millions of people already rely on AI to search for and discover products. Until now, those conversations always ended at a handoff to an app or a checkout screen. Starting today, that boundary begins to disappear.
          - paragraph [ref=f61e60]:
            - link "Sign up for early access!" [ref=f61e62] [cursor=pointer]:
              - /url: https://razorpay.typeform.com/to/KnIhwFxM#source=LP
          - heading [level=2] [ref=f61e63]:
            - img "Razorpay Agentic Payments" [ref=f61e64]
          - heading "From Asking to Buying, Without Leaving the Conversation" [level=2] [ref=f61e65]
          - paragraph [ref=f61e66]:
            - text: Imagine telling your AI assistant,
            - generic [ref=f61e67]: “Order my usual groceries before the match starts.”
            - text: There’s no need to open a grocery app, search through lists, or manually approve each step. The AI understands intent, recalls preferences, checks availability, and completes the purchase on your behalf—securely and transparently.
          - paragraph [ref=f61e68]: What makes this possible is Agentic Payments, a new payment capability built by Razorpay in partnership with National Payments Corporation of India (NPCI). Announced at the India AI Impact Summit, the initiative is currently in pilot with a closed user group and is designed to bring payments directly into AI-native experiences on Claude.
          - paragraph [ref=f61e69]: For the first time, AI in India doesn’t just help users decide what to buy—it can securely complete the purchase itself.
          - heading "Why Everyday Commerce Is the Real Test of Agentic AI" [level=2] [ref=f61e70]
          - paragraph [ref=f61e71]: "Agentic commerce only works when it operates in moments that matter every day. That’s why this launch comes to life through India’s most familiar, high-frequency platforms: Zomato, Swiggy, and Zepto."
          - paragraph [ref=f61e72]: These platforms already serve millions of Indians daily, handling decisions that are often spontaneous, time-sensitive, and repetitive. By enabling Agentic Payments across food, grocery, and quick commerce, AI moves beyond novelty and into habit. Ordering dinner, restocking groceries, or grabbing last-minute snacks becomes as simple as expressing intent.
          - paragraph [ref=f61e73]: In one conversation, a user can ask for Italian food under a budget, request their usual snacks before a match, or order office snacks for a team. The AI agent evaluates options, confirms once, and completes the transaction—end to end—without ever forcing the user out of the flow.
          - paragraph [ref=f61e74]: This is AI acting not as a guide, but as an executor.
          - 'heading "Solving the Biggest Blocker: The Human-in-the-Loop" [level=2] [ref=f61e75]'
          - paragraph [ref=f61e76]: For years, payments have been the natural stopping point for AI-led experiences. While AI could assist with discovery and comparison, the act of paying always required human intervention. Every transaction demanded a manual approval—PINs, OTPs, and repeated authentication—making true autonomy impossible.
          - paragraph [ref=f61e77]: Agentic Payments are designed to remove this friction without compromising trust.
          - paragraph [ref=f61e78]: Built on UPI Reserve Pay, the system allows users to give a one-time, consent-based authorization by setting spending limits for a merchant. Within those limits, AI agents can transact securely on the user’s behalf. There’s no need for repeated PIN prompts, yet users retain full visibility, control, and the ability to revoke consent instantly.
          - paragraph [ref=f61e79]: The result is a model where AI can act decisively, but never independently of the user’s intent.
          - heading [level=2] [ref=f61e80]:
            - img "Agentic payments in AI Summit" [ref=f61e81]
          - heading "Why India Can Lead Agentic Commerce" [level=2] [ref=f61e82]
          - paragraph [ref=f61e83]: Very few markets globally have the infrastructure to support AI-led payments at scale. India does.
          - paragraph [ref=f61e84]: "UPI’s real-time, mandate-enabled framework provides exactly what agentic commerce requires: speed, security, transparency, and consent-driven control. Combined with India’s deeply ingrained digital habits—especially in food and grocery—this creates a rare alignment between technology, regulation, and consumer trust."
          - paragraph [ref=f61e85]: Agentic commerce doesn’t need to be forced into Indian behavior. It fits naturally into how Indians already live, shop, and pay.
          - heading "From Intent to Economic Action" [level=2] [ref=f61e86]
          - paragraph [ref=f61e87]: Agentic Payments on Claude build on Razorpay’s broader efforts with AI platforms and NPCI to redefine how intent turns into economic action. By embedding payments directly into AI-native experiences, Razorpay is helping create a future where conversations don’t stop at recommendations. They end in transactions.
          - paragraph [ref=f61e88]:
            - link "Sign up for early access!" [ref=f61e90] [cursor=pointer]:
              - /url: https://razorpay.typeform.com/to/KnIhwFxM#source=LP
