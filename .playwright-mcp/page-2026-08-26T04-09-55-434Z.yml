          - generic [ref=f191e89]:
            - heading "Project Description" [level=3] [ref=f191e90]
            - generic [ref=f191e91]:
              - paragraph [ref=f191e92]: Hourglass turns a Safe into an automation hub for recurring on-chain operations — subscriptions, DCA strategies, limit orders, and Uniswap LP positions with auto-compounding, without ever handing over custody of the funds.
              - paragraph [ref=f191e93]: "The Safe signs one bounded, revocable delegation per operation instead of a blank-check approval. A delegate ,either a contributor on payroll or an autonomous agent, redeems it. The delegation's on-chain caveat enforcers pin exactly what can happen:"
              - list [ref=f191e94]:
                - listitem [ref=f191e95]: which contract
                - listitem [ref=f191e96]: which method
                - listitem [ref=f191e97]: how much
                - listitem [ref=f191e98]: and where the money can land.
              - paragraph [ref=f191e99]: A compromised or misbehaving delegate can trigger the bounded action. it can't redirect funds, exceed the cap, or touch anything else. Revoking is a single multisig action.
              - paragraph [ref=f191e100]: "Hourglass provide two ways to execute Defi strategies :"
              - list [ref=f191e101]:
                - listitem [ref=f191e102]: you provide your agent the hourglass skill
                - listitem [ref=f191e103]: you let us spin an agent on 0G for you In both case, the agent discover and redeems its own signed delegation and act within its scoped permission, no key handoff, same on-chain guarantees either way.
            - heading "How it's Made" [level=3] [ref=f191e104]
            - generic [ref=f191e105]:
              - paragraph [ref=f191e106]: "Frontend is made with : -Vite"
              - list [ref=f191e107]:
                - listitem [ref=f191e108]: React
                - listitem [ref=f191e109]: "TypeScript Safe App, using @safe-global/safe-apps-react-sdk to run inside Safe{Wallet} and wagmi/viem for chain reads."
              - paragraph [ref=f191e110]: All delegation building and signing goes through MetaMask's Smart Accounts Kit (the Delegation Framework, ERC-7710) — every mandate (the deposit's exact-execution pins, the compound mandate's collect + increaseLiquidity scope, the subscription's period-transfer bound) is our own design, composed from the framework's on-chain enforcer contracts rather than custom Solidity we had to write and audit ourselves.
              - paragraph [ref=f191e111]: The agent use The Graph to query yield opportunity, and move the Safe treasury on Uniswap LP positions by redeeming its delegation, then choose to auto-compounded (collect + increaseLiquidity) via the same delegation primitives; swaps route through the Uniswap Trading API with CLASSIC routing so the resulting router call stays redeemable under a delegation.
              - paragraph [ref=f191e112]: The agent side (yield-agent.ts, run-compound.ts) runs on Bun with viem, discovering and redeeming plans with no custody of principal, only gas.
              - paragraph [ref=f191e113]: We leverage the Intuition Protocol as the discovery register for the signed, off-chain delegation.
