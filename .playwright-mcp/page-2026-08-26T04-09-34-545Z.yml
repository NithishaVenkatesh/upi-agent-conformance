          - generic [ref=f186e62]:
            - heading "Project Description" [level=3] [ref=f186e63]
            - generic [ref=f186e64]:
              - paragraph [ref=f186e65]: Credit cards bind to cards. Allowances bind to addresses. Revoke either and the counterparty returns with a new credential.
              - paragraph [ref=f186e66]: "HumanMandate is an agent card for unsupervised AI spenders, bound to a World AgentBook humanId and enforced in Solidity on World Chain mainnet: daily caps, a locked recipient, one-tap revoke that survives brand-new agent addresses, and a fresh Selfie liveness check to raise limits. Routine spend inside the cap needs no human present — like Face ID for money."
            - heading "How it's Made" [level=3] [ref=f186e67]
            - generic [ref=f186e68]:
              - paragraph [ref=f186e69]: The core is one Solidity contract, HumanMandate, built with Foundry and live on World Chain mainnet.
              - paragraph [ref=f186e70]: "AgentBook humanId — the contract reads the live AgentBook registry from Solidity to resolve agent→human — so caps and revocation follow the person, not the wallet: after revoke, a brand-new agent address still reverts NotAuthorized. All policy is enforced as custom-error reverts (CapExceeded, NotAuthorized, LivenessRequired)"
              - paragraph [ref=f186e71]: Raising limits is the only action that requires a human. The World App mini-app (Next.js 15 + MiniKit) runs a Selfie liveness check; our backend verifies the proof (IDKit + RP signing — MiniKit 2.x removed verify()), binds it to the payer via signal_hash, and an attestor key signs an EIP-712 StepUp attestation that the contract checks inside raiseLimits.
