    - navigation "secondary" [ref=f849e54]:
      - list [ref=f849e57]:
        - listitem [ref=f849e58] [cursor=pointer]:
          - link "Overview" [ref=f849e60]:
            - /url: /product/upi-reserve-pay
    - generic [ref=f849e61]:
      - region:
        - status "carousel"
      - generic [ref=f849e65]:
        - paragraph [ref=f849e66]:
          - text: UPI Reserve Pay lets you reserve money in your account once and use it for multiple payments later. Think of it as putting money aside for future purchases - you reserve the amount upfront, but only pay when you actually buy something or receive a service.
          - strong [ref=f849e67]: What is the product solving
          - text: Today, when you shop online or book services, you either have to pay everything upfront or choose cash-on-delivery to pay later. UPI Reserve Pay solves this wherein merchants get assurance of availability of funds; you retain funds in-account until you actually receive the order.
          - strong [ref=f849e68]: Transaction Limits
        - list [ref=f849e69]:
          - listitem [ref=f849e70]: "Maximum amount you can reserve: ₹10,000 per block"
          - listitem [ref=f849e71]: "Maximum duration for the reserve: 90 days"
        - paragraph [ref=f849e72]:
          - strong [ref=f849e73]: Transaction Process Flow
          - strong [ref=f849e74]: "Setting up your reserve:"
        - list [ref=f849e75]:
          - listitem [ref=f849e76]: Choose UPI Reserve Pay when shopping on a merchant's app
          - listitem [ref=f849e77]: Enter the amount you want to reserve and set how long it should stay reserved within the allowed limits
          - listitem [ref=f849e78]: Choose the UPI App to initiate UPI Reserve Pay set up
          - listitem [ref=f849e79]: Validate the details and confirm with your UPI PIN - this reserves the money in your selected account
          - listitem [ref=f849e80]: The merchant gets confirmation that your money is reserved
        - paragraph [ref=f849e81]:
          - strong [ref=f849e82]: Making payments
          - text: ":"
        - list [ref=f849e83]:
          - listitem [ref=f849e84]: When you order goods or services, and select UPI Reserve Pay to make payments the merchant shall be able to deduct money from your reserved amount
          - listitem [ref=f849e85]: You get notified each time money is deducted
          - listitem [ref=f849e86]: You can track all payments in your Merchant as well as UPI app
        - paragraph [ref=f849e87]:
          - strong [ref=f849e88]: Managing your reserve
          - text: ":"
        - list [ref=f849e89]:
          - listitem [ref=f849e90]: You can modify the reserved amount or cancel it anytime before the expiry
          - listitem [ref=f849e91]: Any unused money gets released back to your account when the reserve expires or is cancelled.
